/* حالة الإشعارات — تُعرض للمستخدم بدل الصمت */
function pushState(){
  if(!canNotify())      return {ok:false, code:'unsupported', msg:T('متصفحك لا يدعم الإشعارات','This browser does not support notifications')};
  if(isIOS() && !isStandalone())
                        return {ok:false, code:'ios-install', msg:T('على الآيفون يجب إضافة الموقع للشاشة الرئيسية ثم فتحه من أيقونته','On iPhone you must add the site to the Home Screen and open it from its icon')};
  if(!('serviceWorker' in navigator)) return {ok:false, code:'nosw', msg:T('المتصفح لا يدعم Service Worker','This browser does not support Service Worker')};
  if(!('PushManager' in window))      return {ok:false, code:'nopush', msg:T('المتصفح لا يدعم Web Push','This browser does not support Web Push')};
  if(Notification.permission==='denied')
                        return {ok:false, code:'denied', msg:T('الإشعارات محظورة — فعّلها من إعدادات المتصفح','Notifications are blocked — enable them in your browser settings')};
  if(Notification.permission!=='granted')
                        return {ok:false, code:'ask', msg:T('لم تُفعّل الإشعارات بعد','Notifications are not enabled yet')};
  if(!lget('reshape:pushsub'))
                        return {ok:false, code:'nosub', msg:T('الإذن ممنوح لكن الجهاز غير مشترك — اضغط تفعيل','Permission granted but this device is not subscribed — press Enable')};
  return {ok:true, code:'ready', msg:T('الإشعارات تعمل — تصلك حتى والتطبيق مغلق','Notifications are working — they reach you even when the app is closed')};
}

function urlB64ToU8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
async function pushFn(payload){
  if(!PUSH_FN) return null;
  try{
    const r=await fetch(PUSH_FN,{method:'POST',headers:SBH(),body:JSON.stringify(payload)});
    return r.ok ? await r.json() : null;
  }catch(err){ return null; }
}
window.pushSaveSub = async function(sub){
  lset('reshape:pushsub',{endpoint:sub.endpoint,ts:Date.now()});
  return pushFn({action:'subscribe', sub:sub,
    role: UI.coachOK && !UI.focus ? 'coach' : 'athlete',
    athlete: ATH?ATH.id:'', name: UI.coachOK?T('الكابتن','Coach'):(ATH?ATH.name:''),
    ua: navigator.userAgent});
};
/* تفعيل كامل: إذن + Service Worker + اشتراك Push + تسجيله في الخادم */
async function pushEnable(){
  const st=pushState();
  if(st.code==='unsupported'||st.code==='ios-install'||st.code==='nosw'||st.code==='nopush'){
    toast(st.msg); return false;
  }
  try{
    const p = Notification.permission==='granted' ? 'granted' : await Notification.requestPermission();
    if(p!=='granted'){ toast(p==='denied'?T('الإشعارات محظورة — فعّلها من إعدادات جوالك','Notifications are blocked — enable them in your phone settings'):T('لم يتم التفعيل','Not enabled')); render(); return false; }
    const reg = window.SW_REG || await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToU8(VAPID_PUBLIC)});
    const res = await window.pushSaveSub(sub.toJSON());
    if(res && res.ok){ toast(T('تم تفعيل الإشعارات على هذا الجهاز','Notifications enabled on this device')); render(); return true; }
    toast(T('فُعّل الإذن لكن تعذّر التسجيل في الخادم — تأكد من نشر Edge Function','Permission granted but registering with the server failed — make sure the Edge Function is deployed')); render(); return false;
  }catch(err){ toast(T('تعذّر التفعيل: ','Could not enable: ')+(err&&err.message?err.message:T('خطأ غير معروف','Unknown error'))); render(); return false; }
}
async function pushDisable(){
  try{
    const reg=window.SW_REG||await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){ await pushFn({action:'unsubscribe',endpoint:sub.endpoint}); await sub.unsubscribe(); }
  }catch(err){}
  try{ localStorage.removeItem('reshape:pushsub'); }catch(e){}
  toast(T('أُوقفت الإشعارات على هذا الجهاز','Notifications stopped on this device')); render();
}

  /* الآيفون لا يدعم new Notification إطلاقاً — العرض يتم عبر Service Worker */
  const reg=window.SW_REG;
  if(reg&&reg.showNotification){
    try{ reg.showNotification(title,opts); return true; }catch(err){}
  }

    navigator.serviceWorker.ready.then(r=>{ try{ r.showNotification(title,opts); }catch(e){} }).catch(()=>{});

/* ===================== متابعة الانقطاع والمواظبة ===================== */
const DAYMS=864e5;
const dayKeyOf = ts => iso(new Date(ts));

/* مجموعة الأيام التي تدرّب فيها فعلياً */
function trainedDays(logs){
  const s=new Set();
  Object.keys(logs||{}).forEach(k=>{
    const l=logs[k];
    if(l&&l.ts&&l.sets&&l.sets.filter(Boolean).length) s.add(dayKeyOf(l.ts));
  });
  return s;
}
function lastTrainTs(logs){
  let m=0;
  Object.keys(logs||{}).forEach(k=>{
    const l=logs[k];
    if(l&&l.ts&&l.sets&&l.sets.filter(Boolean).length&&l.ts>m) m=l.ts;
  });
  return m;
}
/* عدد الأيام الكاملة منذ آخر تمرين — 0 يعني تدرّب اليوم */
function idleDays(logs){
  const ts=lastTrainTs(logs);
  if(!ts) return null;
  const d=new Date(ts); d.setHours(0,0,0,0);
  return Math.round((today0()-d)/DAYMS);
}
/* أيام التدريب المجدولة لبرنامج معيّن — كأرقام أيام الأسبوع (0=الأحد) */
function schedDayNums(progKey){
  const P=(PROGRAMS[progKey]||{}).weeks||[];
  const set=new Set();
  P.forEach(W=>W.days.forEach(D=>{
    const n=dayNumOf(D.d); if(n>=0) set.add(n);
  }));
  return set;
}
/* عدد الحصص المجدولة التي فاتت فعلاً منذ آخر تمرين — يوم الراحة لا يُحتسب انقطاعاً.
   اليوم الحالي لا يُحسب فائتاً لأنه ما زال أمامه وقت للتدريب. */
function missedSessions(logs,progKey){
  const ts=lastTrainTs(logs);
  if(!ts) return null;                       // لم يبدأ البرنامج بعد
  const sched=schedDayNums(progKey);
  const last=new Date(ts); last.setHours(0,0,0,0);
  const end=today0();
  if(!sched.size){                            // برنامج بلا أيام مسمّاة — تقدير متحفظ
    const gap=Math.round((end-last)/DAYMS);
    return gap>=4 ? Math.floor(gap/3) : 0;
  }
  let missed=0;
  const d=new Date(last); d.setDate(d.getDate()+1);
  while(d < end){                             // من اليوم التالي لآخر تمرين حتى أمس
    if(sched.has(d.getDay())) missed++;
    d.setDate(d.getDate()+1);
  }
  return missed;
}
/* سلسلة الأيام المتتالية — تُحتسب من اليوم أو من أمس إن لم يبدأ بعد */
function streakDays(logs){
  const s=trainedDays(logs); if(!s.size) return 0;
  const d=today0();
  if(!s.has(iso(d))) d.setDate(d.getDate()-1);
  let n=0;
  while(s.has(iso(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function beep(f=880,ms=140){
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();
    const o=c.createOscillator(),g=c.createGain();
    o.frequency.value=f;o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.15,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+ms/1000);
    o.start();o.stop(c.currentTime+ms/1000);
  }catch(err){}
}
function chord(list){
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();
    list.forEach(([f,at,dur])=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(c.destination);
      const t=c.currentTime+at;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.start(t); o.stop(t+dur+.05);
    });
  }catch(err){}

function pickImage(file,max,q){
  return new Promise((res,rej)=>{
    if(!file) return rej();
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const sc=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q||.75));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* يقيس العرض الحقيقي بعد الرسم، ويكرّر النص حتى تغطي النسخة الواحدة عرض الشاشة،
   ثم يضاعفها — فلا تبقى مساحة فارغة في أي لحظة من الدورة. */
const TK_SPEED = 62;                      // بكسل/ثانية
function tickerFit(){
  const track=document.querySelector('.ticker .tk-track');
  const mask=document.querySelector('.ticker .tk-mask');
  if(!track||!mask||!TK_UNIT) return;
  const maskW=mask.clientWidth||window.innerWidth||360;
  track.style.animation='none';
  track.innerHTML=TK_UNIT;
  const unitW=track.offsetWidth||track.scrollWidth||1;
  const k=Math.max(1,Math.ceil((maskW+60)/unitW));   // النسخة الواحدة ≥ عرض الشاشة
  const group=new Array(k).fill(TK_UNIT).join('');
  track.innerHTML=group+group;                       // مجموعتان: -50% = دورة كاملة بلا قفزة
  const groupW=track.offsetWidth/2;
  if(groupW<=maskW){ track.style.transform='none'; return; }   // احتياط: لا تحرّك ما لا يحتاج
  const dur=Math.max(10,Math.round(groupW/TK_SPEED));
  if(!TK_T0) TK_T0=Date.now();
  const off=((Date.now()-TK_T0)/1000)%dur;           // يكمل من موضعه بعد أي إعادة رسم
  void track.offsetWidth;
  track.style.animation='tkscroll '+dur+'s linear infinite';
  track.style.animationDelay=(-off)+'s';
}
window.addEventListener('resize',()=>{ clearTimeout(TK_RS); TK_RS=setTimeout(tickerFit,250); });

function graceBlock(){ return ''; }   // طلب المهلة يتم عبر واتساب، والمدرب يمنحه من اللوحة

function subBanner(){
  const i=subInfo(ATH); if(!i) return '';
  const wa=`<a class="wa solid" href="${RENEW_URL}" target="_blank" rel="noopener">${T('تجديد الاشتراك من الموقع','Renew the subscription on the site')}</a>
    <a class="wa solid" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.55)" href="https://wa.me/${COACH_WA}" target="_blank" rel="noopener">${T('أو تواصل عبر واتساب','or contact via WhatsApp')}</a>`;
  const total=(i.start&&i.end)?Math.max(1,Math.round((new Date(i.end+'T00:00:00')-new Date(i.start+'T00:00:00'))/86400000)):null;
  const used=total?Math.min(total,Math.max(0,total-i.days)):null;

  if(i.state==='expired') return `
    <div class="card subcard expired" style="display:block">
      <div class="subhead"><b>${T('انتهى اشتراكك','Subscription ended')}</b><span class="subpct warn">0<span>%</span></span></div>
      <div class="subbar red"><i style="width:0%"></i><u></u></div>
      <div class="subends"><span>${i.start?arDate(i.start):''}</span><span>${T('انتهى ','Ended ')}${arDate(i.end)} — ${subText(i)}</span></div>
      <div class="subwarn">${T('يجب تجديد الاشتراك لمواصلة البرنامج','Renewal is required to continue the program')}${wa}${graceBlock()}</div>
    </div>`;

  const warn=i.state==='soon';
  return `
    <div class="card subcard ${warn?'soon':''}" style="display:block">
      <div class="subhead">
        <b>${i.plan?H(i.plan):T('اشتراكك','Your subscription')} — ${subText(i)}</b>
        <span class="subpct ${warn?'warn':''}">${i.pct}<span>%</span></span>
      </div>
      <div class="subbar ${warn?'red':''}"><i style="width:${i.pct}%"></i><u></u></div>
      <div class="subends">
        <span>${i.start?arDate(i.start):''}</span>
        ${total?`<span>${T('مضى ','ago ')}${used} ${T('من ','of ')}${total} ${T('يوم','day')}</span>`:''}
        <span>${arDate(i.end)}</span>
      </div>
      ${warn?`<div class="subwarn">${T('اشتراكك على وشك الانتهاء — يجب تجديد الاشتراك','Your subscription is about to end — renewal is required')}${wa}${graceBlock()}</div>`:''}
    </div>`;
}

/* بطاقة العودة — تظهر للمتدرب إذا انقطع يوماً أو أكثر */
const COMEBACK=[
 T('اللي فات فات — المهم إنك هنا الحين. ابدأ بمجموعة وحدة وبس.','What is done is done — what matters is that you are here now. Start with one set.'),
 T('حصة فايتة ما تهدم أسابيع تعب. رجوعك اليوم هو اللي يُحسب لك.','One missed session does not undo weeks of work. Coming back today is what counts.'),
 T('البطل مو اللي ما ينقطع، البطل اللي يرجع بسرعة. يلّا 💪','A champion is not someone who never stops, but someone who comes back fast 💪'),
 T('خلّها حصة خفيفة اليوم — الأهم تكسر الانقطاع وترجع للمسار.','Make it a light session today — breaking the gap and getting back on track is what matters.'),
 T('جسمك جاهز أكثر مما تتخيل. أول تمرين وبتلقى الباقي ماشي لحاله.','Your body is more ready than you think. One exercise and the rest follows.'),
 T('ما أحد يبدأ كامل — الكل يتعثر ويرجع. اليوم دورك ترجع 🔥','Nobody is perfect — everyone slips and comes back. Today is your turn 🔥'),
 T('لا تفكر باللي فات، فكّر بالحصة اللي قدامك. قوم يا بطل.','Forget what you missed, think about the session in front of you. Let us go.')
];
function comebackCard(){
  const idle=idleDays(S.logs);
  if(idle===null||idle<1) return '';
  const miss=ATH?missedSessions(S.logs,ATH.program):null;
  if(!miss) return '';                         // لم تفته أي حصة مجدولة — ليس انقطاعاً
  const st=streakDays(S.logs);
  const line=COMEBACK[(miss-1)%COMEBACK.length];
  const dtxt = idle===1?T('يوم واحد','one day') : idle===2?T('يومين','two days') : idle+T(' أيام',' days');
  const mtxt = miss===1?T('حصة واحدة','one session') : miss===2?T('حصتان','two sessions') : miss+T(' حصص',' sessions');
  const wa=ATH?waLink(COACH_WA,T('السلام عليكم كابتن، فاتتني ','Peace be upon you Coach, I missed ')+mtxt+T(' وأبغى أرجع — معك ',' and I want to come back — this is ')+ATH.name):'';
  return `<div class="card comeback">
    <span class="cb-tag">${miss===1?T('فاتتك حصة','You missed a session'):T('فاتتك ','You missed ')+mtxt}</span>
    <b>${T('رجعنا يا بطل ','We are back, champ ')}💪</b>
    <p>${H(line)}</p>
    <div class="cb-facts">
      <span><b>${mtxt}</b>${T('فاتتك من جدولك','you missed from your schedule')}</span>
      <span><b>${allStats().done}</b>${T('مجموعة أنجزتها','sets completed')}</span>
      ${st?`<span><b>${st}</b>${T('يوم متتالٍ سابقاً','consecutive days previously')}</span>`:''}
    </div>
    <div class="cb-row">
      <button class="cb-go" data-goto-today="1">${T('ابدأ حصة اليوم',"Start today's session")}</button>
      <a class="cb-wa" href="${wa}" target="_blank" rel="noopener">${T('كلّم الكابتن','Message the coach')}</a>
    </div>
  </div>`;
}

/* بطاقة "تمرين اليوم" — تُبنى من todaySession() الموجودة، بلا أي بيانات جديدة */
function estMinutes(D){
  let sec=0; D.ex.forEach(x=>{ sec += x.s*((x.r||60)+40); });
  return Math.max(15, Math.round(sec/60/5)*5);
}
function todayCard(){
  const t=todaySession();
  const W=PROGRAM[Math.min(UI.week,PROGRAM.length)-1]||PROGRAM[0];
  if(!t){
    const nextD=W.days[0];
    return `<div class="card today rest">
      <span class="kick">TODAY — REST</span>
      <h2>${T('اليوم راحة','Rest day')}</h2>
      <p class="sub">${T('استفد منها للنوم والاستشفاء — الاستشفاء جزء من البرنامج لا توقّف عنه.','Use it for sleep and recovery — recovery is part of the program, not a break from it.')}</p>
      ${nextD?`<div class="tmeta"><span><b>${T('القادمة','Next')}</b>${H(PT(nextD.d))}</span><span><b>${nextD.ex.length}</b>${T('تمارين','exercises')}</span></div>`:''}
    </div>`;
  }
  const st=dayStats(t.w,t.d), done=st.pct===100;
  return `<div class="card today ${done?'done':''}">
    <span class="kick">${done?'TODAY — COMPLETE':'TODAY — '+(t.D.de||'SESSION')}</span>
    <h2>${H(PT(t.D.d))}</h2>
    <p class="sub">${H(PT(t.D.t))}</p>
    <div class="tmeta">
      <span><b>${T('الأسبوع','Week')}</b>${t.w} ${T('من ','of ')}${PROGRAM.length}</span>
      <span><b>${t.D.ex.length}</b>${T('تمارين','exercises')}</span>
      <span><b>${estMinutes(t.D)}</b>${T('دقيقة تقريباً','minutes approx.')}</span>
      ${st.done?`<span><b>${st.done}/${st.total}</b>${T('مجموعة','sets')}</span>`:''}
    </div>
    <button class="btn ${done?'ghost':''}" data-today="${t.w}-${t.d}">
      ${done?T('أنهيت حصة اليوم — مراجعتها',"Today's session is done — review it"):(st.done?T('أكمل تمرين اليوم',"Finish today's workout"):T('ابدأ تمرين اليوم',"Start today's workout"))}</button>
  </div>`;
}
/* شريط أيام الأسبوع — مكتمل / اليوم / قادم */
function weekStrip(w){
  const W=PROGRAM[w-1]; if(!W) return '';
  return `<div class="wkstrip">${W.days.map((D,d)=>{
    const st=dayStats(w,d);
    const isToday=isTodayName(D.d);
    const cls=st.pct===100?'done':(isToday?'now':'');
    const mark=st.pct===100?'\u2713':(isToday?'\u25CF':'\u25CB');
    return `<span class="d ${cls}"><i>${mark}</i>${H(PT(String(D.d).split(' ')[0]))}</span>`;
  }).join('')}</div>`;
}

  const W=PROGRAM[UI.week-1], ws=weekStats(UI.week), all=allStats();
  const cells = 24, filled = Math.round(all.pct/100*cells);
  return `
  ${subBanner()}
  ${comebackCard()}
  ${todayCard()}
  ${weekStrip(UI.week)}
  ${refMine()?'':`<div class="card refbanner slim" data-tab="ref" role="button" tabindex="0">
    <span class="rbtag">${T('جديد','New')}</span>
    <b>${T('اشتراكك علينا','Your subscription on us')}</b>
    <p>${T('اجمع ','Collect ')}${REF_TARGET}${T(' أصدقاء بكودك واحصل على شهر مجاني.',' friends with your code and get a free month.')}</p>
    <span class="rbgo">${T('احصل على كودك','Get your code')} ←</span>
  </div>`}
  <div class="card hero">${CHEV}
    <div class="phase">WEEK ${W.w} / 4 — ${W.ph}</div>
    <h1>${H(PT(W.pha))}</h1>
    <p>${H(PT(W.obj))}</p>
    <div class="metrics">
      <div class="metric"><b>${ws.pct}<span style="font-size:14px">%</span></b><span>${T('إنجاز الأسبوع','Week completion')}</span></div>
      <div class="metric"><b>${all.done}</b><span>${T('مجموعة منفّذة','sets performed')}</span></div>
      <div class="metric"><b>${all.pct}<span style="font-size:14px">%</span></b><span>${T('البرنامج كامل','Whole program')}</span></div>
    </div>
    <div class="chevbar" aria-hidden="true">${Array.from({length:cells},(_,i)=>`<i class="${i<filled?'f':''}"></i>`).join('')}</div>
  </div>

  ${(()=>{const ps=pushState(); if(ps.ok) return '';
    return `<div class="card setup">
      <h3>${T('تفعيل الإشعارات','Enable notifications')}</h3>
      <p style="font-size:12.5px;color:var(--warm);margin:6px 0 0;line-height:1.9">
        ${ps.code==='ios-install'
          ? T('لتصلك رسائل الكابتن وتذكير حصتك على شاشة القفل: افتح الموقع في سفاري ← زر المشاركة ← <b>إضافة إلى الشاشة الرئيسية</b> ← ثم افتح التطبيق من أيقونته وفعّل الإشعارات.',"To get the coach's messages and your session reminder on the lock screen: open the site in Safari → Share button → <b>Add to Home Screen</b> → then open the app from its icon and enable notifications.")
          : T('فعّل الإشعارات ليصلك رد الكابتن وتذكير حصتك حتى والتطبيق مغلق.',"Enable notifications to get the coach's replies and your session reminder even when the app is closed.")}</p>
      ${ps.code==='ios-install'?'':`<button class="btn" data-ask-notify="1">${T('تفعيل الإشعارات','Enable notifications')}</button>`}
    </div>`;})()}

  <div class="eyebrow">${T('اختر الأسبوع','Choose the week')}</div>
  <div class="weeks">${PROGRAM.map(x=>{
    const st=weekStats(x.w);
    return `<button class="week ${x.w===UI.week?'on':''} ${st.pct===100?'done':''}" data-week="${x.w}">
      <b>${x.w}</b><span>${st.pct}%</span></button>`;}).join('')}</div>

  <div class="eyebrow">${T('حصص الأسبوع — ','Sessions this week — ')}${W.days.map(D=>H(PT(String(D.d).split(' ')[0]))).join(' / ')}</div>
  ${W.days.map((D,d)=>{
    const st=dayStats(UI.week,d);
    return `<button class="card day ${st.pct===100?'complete':''}" data-open="${d}">
      <span class="dnum">0${d+1}</span>
      <span class="dinfo">
        <b>${H(PT(D.d))} — ${D.ex.length} ${T('تمارين','exercises')}</b>
        <span>${H(PT(D.t))}</span>
        <span class="bar" style="margin-top:8px"><i style="width:${st.pct}%"></i></span>
      </span>
      <span class="arrow">${st.pct}%</span>
    </button>`;}).join('')}

  <div class="eyebrow">${T('تقييم الأسبوع','Week rating')}</div>
  ${checkinCard(UI.week)}`;
}

function checkinCard(w){
  const c=S.checkins[w]||{};
  const filled = c.sleep||c.recovery||c.weight;
  return `<div class="card">
    <h3>${T('تقييم نهاية الأسبوع ','End-of-week rating ')}${w}</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:6px 0 0">${T('سجّل النوم والاستشفاء والوزن وأفضل أرقامك — تظهر مباشرة عند المدرب.','Log sleep, recovery, weight and your best numbers — they show up with the coach right away.')}</p>
    <button class="btn ${filled?'ghost':''}" data-checkin="${w}">${filled?T('تعديل التقييم','Edit the rating'):T('تعبئة التقييم','Fill in the rating')}</button>
  </div>`;
}

    <button class="promo-x" data-promo-close="1" aria-label="${T('إغلاق','Close')}">✕</button>
    <div class="promo-box"><iframe src="${url}" title="RESHAPE" allow="autoplay; fullscreen"></iframe></div>
    <span class="promo-hint">${T('٣٤ ثانية · اضغط خارج المقطع للإغلاق','34 seconds · tap outside to close')}</span>`;
  document.body.appendChild(w);
  requestAnimationFrame(()=>w.classList.add('on'));
  w.addEventListener('click',ev=>{ if(ev.target===w||ev.target.closest('[data-promo-close]')) closePromo(); });
}
function closePromo(){
  const w=document.querySelector('.promo-wrap');
  if(!w) return;
  w.classList.remove('on');
  setTimeout(()=>w.remove(),260);
}

/* هجري → ميلادي: تقدير حسابي ثم مطابقة دقيقة بتقويم أم القرى */
function hijriToGreg(hy,hm,hd){
  const jd = Math.floor((11*hy+3)/30) + 354*hy + 30*hm - Math.floor((hm-1)/2) + hd + 1948440 - 385;
  let g = new Date((jd-2440588)*864e5);
  try{
    const fmt=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',
      {day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'});
    for(let off=-3;off<=3;off++){
      const t=new Date(g.getTime()+off*864e5);
      const o={}; fmt.formatToParts(t).forEach(x=>o[x.type]=x.value);
      if(+o.year===hy && +o.month===hm && +o.day===hd) return t;
    }
  }catch(err){}
  return g;
}
/* السنة الهجرية الحالية تقريباً */
function hijriYearNow(){
  try{
    const o={}; new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{year:'numeric',timeZone:'UTC'})
      .formatToParts(new Date()).forEach(x=>o[x.type]=x.value);
    if(+o.year) return +o.year;
  }catch(err){}
  return Math.floor((new Date().getFullYear()-622)*33/32);
}
/* يحوّل اختيار المستخدم الهجري إلى تاريخ ميلادي مخزَّن في FORM.dob */
function syncHijri(){
  if(FORM.cal!=='hijri') return;
  if(!(FORM.hy&&FORM.hm&&FORM.hd)){ FORM.dob=''; return; }
  FORM.dob=iso(hijriToGreg(+FORM.hy,+FORM.hm,+FORM.hd));
}

/* العمر يُحسب من تاريخ الميلاد */
function ageFromDob(dob){
  if(!dob) return 0;
  const b=new Date(dob); if(isNaN(b)) return 0;
  const n=new Date();
  let a=n.getFullYear()-b.getFullYear();
  const m=n.getMonth()-b.getMonth();
  if(m<0||(m===0&&n.getDate()<b.getDate())) a--;
  return a;
}

}

    if(!FORM.injTags.length) return T('اختر «لا يوجد» أو حدّد الإصابة','Select "None" or choose an injury');
    if(FORM.injTags.indexOf('أخرى')>=0 && !(FORM.injnote||'').trim()) return T('اكتب تفاصيل الإصابة الأخرى','Describe the other injury');
  }
  if(i===4 && !FORM.agree) return T('يلزم الموافقة على الإقرار قبل الإرسال','You must accept the waiver before sending');
  return '';
}
function bmiLine(){
  const h=+(FORM.h||0)/100, w=+(FORM.w||0);
  if(!h||!w) return '';
  const b=w/(h*h);
  const lab = b<18.5?T('أقل من الطبيعي','Below normal') : b<25?T('ضمن الطبيعي','Normal range')
            : b<30?T('زيادة بسيطة','Slightly high') : T('يحتاج عملاً على الوزن','Needs work');
  return `<div class="bmi"><b>${b.toFixed(1)}</b><span>${T('مؤشر كتلة الجسم','Body mass index')} — ${lab}</span></div>`;
}
/* مؤشر سحب بقيمة كبيرة وأزرار دقيقة — بديل الكتابة */
function dialer(id,label,val,min,max,unit){
  return `<div class="dial">
    <label class="f" style="margin:0">${H(label)}</label>
    <div class="dial-v"><button class="dstep" data-dial="${id}:-1">−</button>
      <span><b id="${id}_v">${H(String(val))}</b>${H(unit)}</span>
      <button class="dstep" data-dial="${id}:1">+</button></div>
    <input type="range" class="rng" id="j_${id}" min="${min}" max="${max}" step="1" value="${H(String(val))}"
           data-rng="${id}">
    <div class="dial-ends"><span>${max} ${H(unit)}</span><span>${min} ${H(unit)}</span></div>
  </div>`;
}

function lineChart(data){
  const w=520,h=170,p=26, min=5, max=10;
  const x=i=>p+i*((w-p*2)/Math.max(1,data.length-1));
  const y=v=>h-p-((v-min)/(max-min))*(h-p*2);
  const pts=data.map((d,i)=>`${x(i)},${y(d.v)}`).join(' ');
  const area=`${p},${h-p} `+data.map((d,i)=>`${x(i)},${y(d.v)}`).join(' ')+` ${x(data.length-1)},${h-p}`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="${T('مسار ','trend ')}RPE">
    <defs><linearGradient id="rpeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--c1)" stop-opacity=".38"/>
      <stop offset="100%" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#rpeg)"/>
    ${[6,7,8,9,10].map(v=>`<line x1="${p}" x2="${w-p}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/>
      <text x="${p-6}" y="${y(v)+4}" style="fill:var(--muted)" font-size="10" text-anchor="end" font-family="Barlow Semi Condensed">${v}</text>`).join('')}
    <polyline points="${pts}" fill="none" style="stroke:var(--orange)" stroke-width="2.5" stroke-linejoin="round"/>
    ${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.v)}" r="4.5" style="fill:${PAL[i%6]};stroke:var(--card1);stroke-width:2"/>
      <text x="${x(i)}" y="${h-8}" style="fill:var(--muted)" font-size="9" text-anchor="middle">${d.label}</text>`).join('')}
  </svg>`;
}

function collectTests(){

    if(l&&l.v) out.push({n:x.n,w:W.w,v:l.v+' '+(x.unit||'')});

}

function pctOf(row,progKey){
  const weeks=(PROGRAMS[progKey]||PROGRAMS[Object.keys(PROGRAMS)[0]]).weeks;
  const logs=(row&&row.data&&row.data.logs)||{};
  let done=0,total=0;
  weeks.forEach((W,wi)=>W.days.forEach((D,d)=>D.ex.forEach((x,i)=>{
    total+=x.s;
    const l=logs[(wi+1)+'-'+d+'-'+i];
    if(l&&l.sets) done+=Math.min(l.sets.filter(Boolean).length,x.s);
  })));
  return {done,total,pct: total?Math.round(done/total*100):0,last:(row&&row.updated)||0};
}

/* هل اليوم يوم تمرين في جدول هذا المتدرب؟ (حتى لا يُحسب يوم الراحة انقطاعاً) */
function isTrainDayFor(progKey){

  return P.some(W=>W.days.some(D=>isTodayName(D.d)));
}

/* تصنيف المتدربين: منقطع (يوم فأكثر) / مواظب (تدرّب اليوم أو أمس) */
function followRows(){
  const away=[], good=[];
  ROSTER.forEach(a=>{
    const logs=((ALL[a.id]||{}).data||{}).logs||{};
    const idle=idleDays(logs);
    const miss=missedSessions(logs,a.program);
    const st=streakDays(logs);
    const sched=schedDayNums(a.program);
    const row={a,idle,miss:miss||0,streak:st,last:lastTrainTs(logs),phone:a.phone||'',
               perWeek:sched.size||null};
    if(idle===null) return;                        // لم يبدأ البرنامج بعد
    if(miss>=1) away.push(row); else good.push(row);   // فاتته حصة مجدولة فعلاً
  });
  away.sort((x,y)=> (y.miss-x.miss) || (y.idle-x.idle));
  good.sort((x,y)=>y.streak-x.streak);
  return {away,good};
}

function rosterRows(){
  return ROSTER.map(a=>{
    const st=pctOf(ALL[a.id],a.program);
    const P=(PROGRAMS[a.program]||{}).weeks||[];
    const logs=((ALL[a.id]||{}).data||{}).logs||{};
    let cur=0;
    P.forEach((W2,wi)=>{ if(Object.keys(logs).some(k=>k.startsWith((wi+1)+'-'))) cur=wi+1; });

  });
}

          <span class="rpct" style="color:var(--orange)">${Math.min(100,x.c.paid*REF_DISCOUNT)}<i>%</i></span>
        </div>
        <div class="bar" style="margin-top:9px"><i style="width:${Math.min(100,x.c.paid*REF_DISCOUNT)}%;background:var(--orange)"></i></div>
        <span class="rsub">${x.c.paid} ${T('مكتمل','completed')} · ${x.c.all-x.c.paid} ${T('قيد المراجعة','pending')}
          ${x.c.paid>=REF_TARGET?' · 🤸‍♂️ '+T('استحق شهراً مجانياً','earned a free month'):''}</span>
        <div class="fbtns">
          <a class="fwa" href="${waLink(x.r.phone,T('مبروك! كودك ','Congrats! Your code ')+x.r.code+T(' سجّل به ',' has ')+x.c.paid+T(' أشخاص — خصمك الحالي ',' completed signups — your current discount is ')+Math.min(100,x.c.paid*REF_DISCOUNT)+'%')}" target="_blank" rel="noopener">${T('إبلاغه','Notify')}</a>
          <button class="fghost" data-copy="${H(x.r.code)}">${T('نسخ الكود','Copy code')}</button>
        </div>
      </div>`).join('')
      : `<div class="card"><div class="note" style="border-left-color:var(--c3)">
          <b>${T('لا يوجد مشتركون بعد','Nobody has joined yet')}</b><br>${T('شارك رابط صفحة البرنامج ليبدأ المتدربون بالتسجيل.','Share the program page link so athletes can start joining.')}</div></div>`}

    <div class="hair accent"></div>
    <div class="sect">${T('طلبات وصلت بأكواد','Signups using a code')} <span class="n">${used.length}</span></div>
    ${used.length? used.map(l=>`
      <div class="card fcard ${l.refPaid?'':'away'}">
        <div class="frow">
          <span class="fmeta"><b>${H(l.name)} <span class="rcode-sm sm">${H(l.ref)}</span></b>
            <span>${H(l.phone)} · ${H(l.plan||'—')} · ${new Date(l.ts).toLocaleDateString(LOCALE(),{day:'numeric',month:'short'})}</span></span>
          <span class="subchip ${l.refPaid?'ok':'soon'}">${l.refPaid?T('مؤكّد','confirmed'):T('بانتظار الدفع','awaiting payment')}</span>
        </div>
        <div class="fbtns">
          <button class="${l.refPaid?'fghost':'fwa'}" style="${l.refPaid?'':'border:0'}" data-ref-paid="${l.ts}">
            ${l.refPaid?T('إلغاء التأكيد','Undo confirmation'):T('تأكيد إتمام الدفع','Confirm payment')}</button>
        </div>
      </div>`).join('')
      : `<div class="card"><div class="note"><b>${T('لم يسجّل أحد بكود بعد','No coded signups yet')}</b></div></div>`}

    <div class="hair accent"></div>
    <button class="btn ghost" data-tab="ref">${T('عرض صفحة البرنامج','View the program page')}</button>`;
  }

  /* ============ المتابعة والتحفيز ============ */
  if(sec==='follow'){
    const dtxt=n=> n===1?T('يوم واحد','one day') : n===2?T('يومين','two days') : n+T(' أيام',' days');
    const noPhone=T('<span style="font-size:11px;color:var(--c6)">⚠ لا يوجد رقم جوال — أضفه من الملفات</span>','<span style="font-size:11px;color:var(--c6)">⚠ No phone number — add one from Athletes</span>');

    const awayUI = FOLLOW.away.length ? FOLLOW.away.map(r=>`
      <div class="card fcard away">
        <div class="frow">
          ${avatarTag((((ALL[r.a.id]||{}).data||{}).profile||{}).avatar,r.a.name)}
          <span class="fmeta">
            <b>${H(r.a.name)}<span class="subchip expired">${r.miss===1?T('فاتته حصة','Missed a session'):T('فاتته ','missed ')+r.miss+T(' حصص',' sessions')}</span></b>
            <span>${T('آخر تمرين ','Last workout ')}${new Date(r.last).toLocaleDateString(LOCALE(),{weekday:'long',day:'numeric',month:'short'})}
              · ${T('قبل ','before ')}${dtxt(r.idle)}${r.perWeek?' · '+r.perWeek+T(' أيام تدريب بالأسبوع',' training days per week'):''}</span>
          </span>
        </div>
        <div class="fbtns">
          ${r.phone
            ? `<a class="fwa" href="${waLink(r.phone,nudgeText(r.a.name,r.miss,r.idle))}" target="_blank" rel="noopener">${T('تحفيز عبر واتساب','Motivate on WhatsApp')}</a>`
            : noPhone}
          <button class="fghost" data-open-ath="${H(r.a.id)}">${T('فتح ملفه','Open their file')}</button>
        </div>
      </div>`).join('')
      : `<div class="card"><div class="note" style="border-left-color:var(--c3)">
          <b>${T('ما فيه أحد منقطع','Nobody is off track')}</b><br>${T('كل متدرب ملتزم بأيام برنامجه — ما فاتت أي حصة مجدولة ','Every athlete is on track with their own training days — no scheduled session missed ')}👏</div></div>`;

    const goodUI = FOLLOW.good.length ? FOLLOW.good.map(r=>`
      <div class="card fcard good">
        <div class="frow">
          ${avatarTag((((ALL[r.a.id]||{}).data||{}).profile||{}).avatar,r.a.name)}
          <span class="fmeta">
            <b>${H(r.a.name)}<span class="subchip ok">${r.streak>=2?r.streak+T(' أيام متتالية',' consecutive days'):T('تدرّب اليوم','Trained today')}</span></b>
            <span>${T('آخر تمرين ','Last workout ')}${new Date(r.last).toLocaleDateString(LOCALE(),{weekday:'long',day:'numeric',month:'short'})}</span>
          </span>
        </div>
        <div class="fbtns">
          ${r.phone
            ? `<a class="fwa thanks" href="${waLink(r.phone,thanksText(r.a.name,r.streak))}" target="_blank" rel="noopener">${T('إرسال شكر','Send thanks')}</a>`
            : noPhone}
          <button class="fghost" data-open-ath="${H(r.a.id)}">${T('فتح ملفه','Open their file')}</button>
        </div>
      </div>`).join('')
      : `<div class="card"><div class="note" style="border-left-color:var(--c6)">
          <b>${T('لا أحد سجّل تمريناً اليوم بعد','Nobody has logged a session today yet')}</b><br>${T('الوقت مبكر — راجع القائمة مساءً','Too early — check the list this evening')}</div></div>`;

    return head+`
    <div class="kpi">
      <div class="card c6 tint t6"><b>${FOLLOW.away.length}</b><span>${T('فاتته حصة مجدولة','Missed a scheduled session')}</span></div>
      <div class="card c3 tint t3"><b>${FOLLOW.good.length}</b><span>${T('مواظب حالياً','Consistent right now')}</span></div>
    </div>
    <p style="font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.8">
      ${T('كل ضغطة على «تحفيز» أو «شكر» تفتح واتساب برسالة جاهزة ','Every tap on "Motivate" or "Thank" opens WhatsApp with a ready message ')}<b style="color:var(--warm)">${T('مختلفة في كل مرة','different every time')}</b> —
      ${T('راجعها قبل الإرسال وعدّل عليها إن رغبت.','Review it before sending and edit it if you like.')}</p>

    <div class="sect">${T('فاتتهم حصص ','Missed sessions ')}<span class="n">${FOLLOW.away.length}</span></div>
    <p style="font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.7">
      ${T('الحساب على أيام برنامج كل متدرب — من تدرّب الخميس وبرنامجه ٣ أيام لا يُعدّ منقطعاً يوم الجمعة أو السبت.',"Counted against each athlete's own training days — someone who trained Thursday on a 3-day plan is not absent on Friday or Saturday.")}</p>
    ${awayUI}
    <div class="sect">${T('مواظبون ','Consistent ')}<span class="n">${FOLLOW.good.length}</span></div>
    ${goodUI}
    <div class="hair accent"></div>
    ${notifUI}
    <button class="btn ghost" data-refresh-all="1">${T('تحديث بيانات الجميع',"Refresh everyone's data")}</button>`;
  }

  /* ============ طلبات الاشتراك ============ */
  if(sec==='leads'){
    return head+`
    <div class="kpi">
      <div class="card c1 tint t1"><b>${newLeads.length}</b><span>${T('طلب جديد','New request')}</span></div>
      <div class="card c2 tint t2"><b>${LEADS.length}</b><span>${T('إجمالي الطلبات','Total requests')}</span></div>
    </div>
    <div class="sect">${T('الطلبات','Requests')}</div>
    ${LEADS.length?LEADS.map(l=>`
      <div class="card ${l.status==='new'?'alertcard':''}">
        <div style="display:flex;align-items:center;gap:8px">
          <b style="font-size:17px;flex:1">${H(l.name)}</b>
          ${l.status==='new'?T('<span class="subchip soon">جديد</span>','<span class="subchip soon">New</span>'):T('<span class="subchip ok">تمّت المعالجة</span>','<span class="subchip ok">Processed</span>')}
        </div>
        <div class="facts" style="margin-top:10px">
          <div class="fact"><b style="font-size:15px">${H(l.sex||'—')}</b><span>${T('الجنس','Sex')}</span></div>
          <div class="fact"><b style="font-size:15px">${H(l.age||'—')}</b><span>${T('العمر','Age')}</span></div>
          <div class="fact"><b style="font-size:15px">${H(l.h||'—')}</b><span>${T('الطول سم','Height cm')}</span></div>
          <div class="fact"><b style="font-size:15px">${H(l.w||'—')}</b><span>${T('الوزن كجم','Weight kg')}</span></div>
          <div class="fact"><b style="font-size:14px">${H(l.plan||'—')}</b><span>${T('الباقة','Plan')}</span></div>
          <div class="fact"><b style="font-size:15px">${H(l.days||'—')}</b><span>${T('أيام متاحة','days available')}</span></div>
          <div class="fact"><b style="font-size:13px">${H(l.level||'—')}</b><span>${T('المستوى','Level')}</span></div>
          <div class="fact" style="grid-column:span 2"><b style="font-size:12.5px">${H(l.sports||'—')}</b><span>${T('الرياضات التي يمارسها','Sports they practise')}</span></div>
          <div class="fact"><b style="font-size:13px">${H(l.pay||'—')}</b><span>${T('طريقة الدفع','Payment method')}</span></div>
          <div class="fact"><b style="font-size:13px;color:${l.agreed?'var(--c3)':'var(--c6)'}">${l.agreed?T('وقّع ✅','Signed ✅'):T('لم يوقّع','Not signed')}</b><span>${T('إخلاء المسؤولية','Disclaimer')}</span></div>
        </div>
        <div class="note" style="margin-top:11px"><b>${T('الهدف','Goal')}</b><br>${H(l.goal||'—')}</div>
        <div class="note" style="border-left-color:var(--c5)"><b>${T('إصابات سابقة','Previous injuries')}</b><br>${H(l.inj||'—')}</div>
        ${l.bill?`<div class="shots"><div class="shot"><img src="${l.bill}" data-shot="1" alt=""><span>${T('الفاتورة','Receipt')}</span></div></div>`:''}
        <span style="display:block;font-size:11.5px;color:var(--muted);margin-top:9px">
          ${H(l.phone)} · ${new Date(l.ts).toLocaleString(LOCALE(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
        <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">
          ${(()=>{ const ex=leadExists(l);
            return ex
              ? `<button class="logbtn has" data-lead-open="${H(ex.id)}" style="margin:0">${T('فتح حسابه','Open their account')}</button>`
              : `<button class="logbtn mk" data-lead-make="${l.ts}" style="margin:0">${T('إنشاء حساب فوري','Create account now')}</button>`;
          })()}
          <a class="logbtn has" style="margin:0;text-decoration:none" href="https://wa.me/966${H(String(l.phone).replace(/^0/,'').replace(/\D/g,''))}" target="_blank" rel="noopener">${T('واتساب المتدرب',"Athlete's WhatsApp")}</a>
          <button class="logbtn has" data-lead-welcome="${l.ts}" style="margin:0">${T('رسالة ترحيب','Welcome message')}</button>
          ${l.status==='new'?`<button class="logbtn" data-lead-done="${l.ts}" style="margin:0">${T('تمّت المعالجة','Processed')}</button>`:''}
          <button class="logbtn" data-lead-del="${l.ts}" style="margin:0">${T('حذف','Delete')}</button>
        </div>
      </div>`).join('')
     :T('<div class="empty">لا توجد طلبات — شارك رابط الموقع ليصلك المشتركون الجدد.</div>','<div class="empty">No requests yet — share the site link so new subscribers reach you.</div>')}`;
  }

  /* ============ التقدّم ============ */
  if(sec==='progress'){
    const sorted=rows.slice().sort((x,y)=>y.st.pct-x.st.pct);
    return head+`
    <div class="sect">${T('ترتيب الالتزام ','Adherence ranking ')}<span class="n">${rows.length} ${T('متدرب','athlete')}</span></div>
    <div class="card">${rankList(sorted)}</div>

    <div class="sect">${T('تفاصيل أسبوع بأسبوع','Week-by-week detail')}</div>
    ${sorted.map((r,ri)=>athCard(r,ri,`
      <div class="wkgrid">${r.weeks.map((W2,wi)=>{
        const logs=((ALL[r.a.id]||{}).data||{}).logs||{};
        let dn=0,tt=0;
        W2.days.forEach((D,di)=>D.ex.forEach((x,xi)=>{ tt+=x.s;
          const l=logs[(wi+1)+'-'+di+'-'+xi]; if(l&&l.sets) dn+=Math.min(l.sets.filter(Boolean).length,x.s); }));
        const p=tt?Math.round(dn/tt*100):0;
        return `<div class="wkcard"><b style="color:${PAL[wi%6]}">${p}%</b>
          <span>${T('الأسبوع ','Week ')}${wi+1}</span>
          <span class="bar"><i style="width:${p}%;background:${PAL[wi%6]}"></i></span></div>`;}).join('')}</div>
      <button class="logbtn has" data-open-ath="${H(r.a.id)}" style="margin-top:11px">${T('فتح الملف الكامل','Open the full file')}</button>`)).join('')}`;
  }

  /* ============ الاشتراكات ============ */
  if(sec==='subs'){
    return head+`
    <div class="kpi">
      <div class="card c3 tint t3"><b>${Math.max(0,ROSTER.length-expired-noSub)}</b><span>${T('اشتراك سارٍ','Active subscription')}</span></div>
      <div class="card c5 tint t5"><b>${soon}</b><span>${T('ينتهي خلال أسبوع','Ends within a week')}</span></div>
      <div class="card c6 tint t6"><b>${expired}</b><span>${T('منتهٍ','Expired')}</span></div>
      <div class="card c4 tint t4"><b>${noSub}</b><span>${T('بلا اشتراك','No subscription')}</span></div>
    </div>
    <div class="sect">${T('جدول الاشتراكات','Subscriptions table')}</div>
    <div class="card scroll"><table class="t">
      <thead><tr><th>${T('المتدرب','Athlete')}</th><th>${T('الباقة','Plan')}</th><th>${T('البداية','Start')}</th><th>${T('الانتهاء','End')}</th><th>${T('المتبقي','Remaining')}</th><th></th></tr></thead>
      <tbody>${subs.map(x=>`<tr>
        <td><b>${H(x.a.name)}</b></td>
        <td>${x.i?H(x.i.plan||'—'):'—'}</td>
        <td>${x.i&&x.i.start?arDate(x.i.start):'—'}</td>
        <td>${x.i?arDate(x.i.end):'—'}</td>
        <td>${x.i?`<span class="subchip ${x.i.state}">${subText(x.i)}</span>`:T('<span style="color:var(--muted)">غير مسجّل</span>','<span style="color:var(--muted)">Not registered</span>')}</td>
        <td style="white-space:nowrap">
          <button class="logbtn" data-sub="${H(x.a.id)}" style="margin:0">${x.i?T('تجديد','Renew'):T('تفعيل','Enable')}</button>
          <button class="logbtn" data-quick5="${H(x.a.id)}" style="margin:0">+5 ${T('أيام','days')}</button>
        </td></tr>`).join('')}</tbody></table>
      ${noSub?`<p style="font-size:12px;color:var(--muted);margin:10px 0 0">${noSub} ${T('متدرب بلا اشتراك — يُقفل عليه حتى التفعيل.','athlete without a subscription — locked until activation.')}</p>`:''}
    </div>`;
  }

  /* ============ اللوحة الإعلانية ============ */
  if(sec==='ann'){
    return head+`
    <div class="sect">${T('رسالة جديدة لجميع المتدربين','New message to all athletes')}</div>
    <div class="card">
      <label class="f">${T('النوع','Type')}</label>
      <select class="inp" id="an_kind">
        <option value="msg">${T('رسالة من الكابتن','Message from the coach')}</option>
        <option value="challenge">${T('تحدي','Challenge')}</option>
        <option value="note">${T('إعلان عام','General announcement')}</option>
      </select>
      <label class="f">${T('العنوان','Title')}</label>
      <input class="inp" id="an_title" placeholder="${T('مثال: تحدي الأسبوع — 100 عقلة','Example: Week challenge — 100 pull-ups')}">
      <label class="f">${T('النص','Text')}</label>
      <textarea class="inp" id="an_body" placeholder="${T('اكتب رسالتك التحفيزية أو تفاصيل التحدي','Write your motivational message or the challenge details')}"></textarea>
      <label class="f">${T('تظهر حتى تاريخ (اختياري)','Show until date (optional)')}</label>
      <input class="inp" id="an_until" type="date">
      <button class="btn" data-add-ann="1">${T('نشر للجميع','Publish to all')}</button>
    </div>
    <div class="sect">${T('المنشور حالياً ','Currently published ')}<span class="n">${ANN.length}</span></div>
    ${ANN.length?ANN.map(an=>`
      <div class="card" style="border-inline-start:4px solid ${an.kind==='challenge'?'var(--c5)':an.kind==='note'?'var(--c2)':'var(--c1)'}">
        <b style="font-size:15px">${H(an.title)}</b>
        ${an.body?`<p style="font-size:13px;color:var(--warm);margin:6px 0 0;white-space:pre-wrap">${H(an.body)}</p>`:''}
        <span style="display:block;font-size:11px;color:var(--muted);margin-top:8px">
          ${new Date(an.ts).toLocaleDateString(LOCALE(),{day:'numeric',month:'long'})}${an.until?T(' · حتى ',' · until ')+arDate(an.until):''}</span>
        <button class="logbtn" data-del-ann="${an.ts}" style="margin-top:9px">${T('حذف','Delete')}</button>
      </div>`).join('')
     :T('<div class="empty">لا توجد إعلانات — اكتب أول رسالة لمتدربيك.</div>','<div class="empty">No announcements — write your first message to your athletes.</div>')}`;
  }

  /* ============ مساحة السحابة ============ */
  if(sec==='usage'){
    const u=UI.usage;
    if(!u) return head+`
      <div class="sect">${T('مساحة السحابة','Cloud storage')}</div>
      <div class="card">
        <p style="font-size:13px;color:var(--warm);margin:0">
          ${T('اضغط الزر لقياس المساحة المستخدمة فعلياً في قاعدة البيانات الآن.','Press the button to measure the space actually used in the database right now.')}</p>
        <button class="btn" data-scan-usage="1">${T('قياس المساحة','Measure storage')}</button>
      </div>`;
    const CAP=500*1048576;                      // 500 م.ب في الخطة المجانية
    const pct=Math.max(1,Math.round(u.total/CAP*1000)/10);
    const per=u.count?u.total/Math.max(1,ROSTER.length):0;
    const room=Math.max(0,Math.floor((CAP*0.8-u.total)/Math.max(1,per)));
    const col = pct>70?'var(--c6)':pct>40?'var(--c5)':'var(--c3)';
    return head+`
    <div class="sect">${T('المساحة المستخدمة','Storage used')}</div>
    <div class="card">${donut(Math.max(1,Math.round(pct)),col,fmtMB(u.total)+T(' من 500 م.ب',' of 500 MB'),
      T('الخطة المجانية · ','Free plan · ')+u.count+T(' سجل في قاعدة البيانات',' records in the database'))}
      <div class="facts" style="margin-top:14px">
        <div class="fact"><b style="color:${col};font-size:19px">${pct}%</b><span>${T('من السعة','of capacity')}</span></div>
        <div class="fact"><b style="font-size:16px">${fmtMB(per)}</b><span>${T('متوسط المتدرب','Athlete average')}</span></div>
        <div class="fact"><b style="font-size:19px">${room>999?'999+':room}</b><span>${T('متدرب إضافي ممكن','more athletes possible')}</span></div>
        <div class="fact"><b style="font-size:16px">${fmtMB(CAP-u.total)}</b><span>${T('المتبقي','Remaining')}</span></div>
      </div>
      <div class="note" style="margin-top:12px;border-left-color:${col}">
        ${pct<40?T('<b>وضعك مريح جداً</b><br>المساحة تكفيك لسنوات بهذا المعدّل.','<b>You are in great shape</b><br>This storage lasts you for years at this rate.')
         :pct<70?T('<b>راقب المساحة شهرياً</b><br>احذف تقارير InBody القديمة إن احتجت مساحة.','<b>Check your storage monthly</b><br>Delete old InBody reports if you need space.')
         :T('<b>اقتربت من الحد</b><br>احذف تقارير InBody القديمة أو رقّ الخطة.','<b>Getting close to the limit</b><br>Delete old InBody reports or upgrade the plan.')}
      </div>
    </div>

    <div class="sect">${T('أكبر السجلات','Largest records')}</div>

function allNotes(){
  const out=[];
  PROGRAM.forEach(W=>W.days.forEach((D,d)=>{
    D.ex.forEach((x,i)=>{const l=has(W.w,d,i); if(l&&l.note) out.push({w:W.w,day:D.d,ex:x.n,t:l.note});});
    const dn=S.logs['note-'+W.w+'-'+d];
    if(dn&&dn.note) out.push({w:W.w,day:D.d,ex:'',t:dn.note});
  }));
  return out.reverse();
}

/* ===== تعليقات المتدربين على التمارين — تجميع من بيانات الجميع (قراءة فقط) ===== */
function allAthNotes(){
  const out=[];
  ROSTER.forEach(a=>{
    const logs=((ALL[a.id]||{}).data||{}).logs||{};
    const P=(PROGRAMS[a.program]||{}).weeks||[];
    Object.keys(logs).forEach(k=>{
      const l=logs[k];
      if(!l||!l.note||!String(l.note).trim()) return;
      let w,d,i=null;
      if(k.indexOf('note-')===0){ const p=k.slice(5).split('-'); w=+p[0]; d=+p[1]; }
      else { const p=k.split('-'); if(p.length<3) return; w=+p[0]; d=+p[1]; i=+p[2]; }
      if(!(w>0)||!(d>=0)) return;
      const W=P[w-1], D=W&&W.days&&W.days[d];
      const X=(i!==null&&D&&D.ex)?D.ex[i]:null;
      out.push({
        id:a.id, name:a.name, w:w, day:D?D.d:(T('اليوم ','Day ')+(d+1)),
        ex:X?X.n:'', exAr:X?(X.a||''):'', dayNote:(i===null),
        t:String(l.note), res:l.v||'', rpe:l.rpe||'', ts:l.ts||0
      });
    });
  });
  return out.sort((x,y)=>y.ts-x.ts);
}
/* حالة قراءة التعليقات: عام + لكل متدرب على حدة */
function notesSeen(){
  const v=lget('reshape:noteseen');
  if(typeof v==='number') return {all:v,by:{}};        /* الصيغة القديمة */
  return {all:+((v&&v.all)||0), by:((v&&v.by)||{})};
}
function notesSeenTs(id){
  const s=notesSeen();
  return Math.max(s.all, id?(+s.by[id]||0):0);
}
function isNewNote(n){ return n.ts>notesSeenTs(n.id); }
function newNotes(){ return allAthNotes().filter(isNewNote); }
/* تعليم تعليقات متدرب واحد كمقروءة */
function notesSeenFor(id){
  if(!id) return;
  const mine=allAthNotes().filter(n=>n.id===id);
  if(!mine.length) return;
  const s=notesSeen();
  s.by[id]=Math.max(+s.by[id]||0, Math.max.apply(null,mine.map(n=>n.ts)));
  lset('reshape:noteseen',s);
}
function notesSeenAll(){
  const ns=allAthNotes(); const s=notesSeen();
  s.all = ns.length ? Math.max.apply(null,ns.map(n=>n.ts)) : Date.now();
  lset('reshape:noteseen',s);
}

/* إشعار فوري للمدرب عند أي تعليق جديد — لا يفتح ملف المتدرب */
let NOTE_NOTIF = 0;
function noteWatch(){
  if(!UI.coachOK||!ROSTER.length) return;
  if(!NOTE_NOTIF){ NOTE_NOTIF=+(lget('reshape:notenotif')||0); }
  const fresh=allAthNotes().filter(n=>n.ts>NOTE_NOTIF);
  if(!fresh.length) return;
  NOTE_NOTIF=Math.max.apply(null,fresh.map(n=>n.ts));
  lset('reshape:notenotif',NOTE_NOTIF);
  fresh.slice(0,3).forEach(n=>{
    nativeNotify(T('💬 تعليق جديد — ','💬 New comment — ')+n.name,
      (n.ex?(n.exAr||n.ex)+' · ':'')+n.day+T(' · الأسبوع ',' · week ')+n.w+'\n'+n.t.slice(0,90));
  });
  beep(660,180); vibrate([120,70,120]);
  if(UI.view==='coach'&&!UI.focus) renderQuiet();
}

function waNum(p){
  let d=String(p||'').replace(/\D/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  if(d.startsWith('966')) return d;
  return '966'+d.replace(/^0/,'');
}
/* ---------- إنشاء حساب متدرب من طلب اشتراك بضغطة واحدة ---------- */
const planMonths = t => {
  const p=PLANS.find(x=>x.t===t || T(x.t,x.k==='1'?'1 month':x.k+' months')===t);
  if(p) return +p.k;
  const m=String(t||'').match(/\d+/);
  return m ? +m[0] : 1;                       /* «شهر» بلا رقم = شهر واحد */
};
function addMonths(iso0,n){
  const d=new Date(iso0+'T00:00:00');
  const day=d.getDate();
  d.setMonth(d.getMonth()+n);
  if(d.getDate()<day) d.setDate(0);           /* 31 يناير + شهر = 28/29 فبراير */
  return iso(d);
}
const newPin = ()=> String(Math.floor(1000+Math.random()*9000));
function leadExists(l){
  return ROSTER.find(a=>waNum(a.phone||'')===waNum(l.phone))
      || ROSTER.find(a=>a.name===l.name) || null;
}
async function leadToAthlete(ts){
  const l=LEADS.find(x=>x.ts===ts);
  if(!l) throw new Error('lead');
  const dup=leadExists(l);
  if(dup) return {a:dup,dup:true};
  const start=iso(today0());
  const months=planMonths(l.plan);
  const rec={
    id:'a'+Math.random().toString(36).slice(2,8),
    name:(l.name||'').trim(),
    phone:(l.phone||'').trim(),
    pin:newPin(),
    program:Object.keys(PROGRAMS)[0]||'fl4w',
    created:Date.now(),
    sub:{plan:l.plan||T('شهر','1 month'), start:start, end:addMonths(start,months)}
  };
  ROSTER.push(rec);
  await rosterSave();
  /* اربط الطلب بالحساب وأغلقه */
  LEADS=LEADS.map(x=>x.ts===ts?Object.assign({},x,{status:'done',athlete:rec.id}):x);
  try{ await cloudSet('__leads',{list:LEADS},Date.now()); }catch(e){}
  return {a:rec,dup:false};
}

function welcomeText(a,lead){

  const L=[];
  L.push(T('أهلاً ','Hello ')+a.name+' 👋');

  L.push(T('🔑 الرمز السري: ','🔑 Access code: ')+(a.pin||'—'));
  L.push('');
  L.push(T('طريقة البدء:','How to start:'));
  L.push(T('1) افتح الرابط وسجّل الدخول برقمك ورمزك.','1) Open the link and sign in with your number and code.'));

  L.push(T('4) علّم كل مجموعة فور إنهائها ليصلني تقدّمك.','4) Tick every set the moment you finish it so your progress reaches me.'));
  L.push(T('5) عند أي ألم غير طبيعي اضغط زر «أبلغ المدرب» فوراً.','5) At any abnormal pain press "Report pain" immediately.'));

function startRest(sec,label,next){
  stopRest();
  let left=sec; const total=Math.max(1,sec);
  const R=120, C=2*Math.PI*R;
  const el=document.createElement('div'); el.className='restfull';
  el.innerHTML=`
    <div class="ringwrap">
      <svg viewBox="0 0 300 300">
        <circle class="track" cx="150" cy="150" r="${R}"></circle>
        <circle class="fill" cx="150" cy="150" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="0"></circle>
      </svg>
      <div class="mid">
        <span class="of">REST</span>
        <span class="num">${mmss(left)}</span>
        <span class="of" id="r_state">${T('وقت الراحة','Rest time')}</span>
      </div>
    </div>
    <h3>${H(label||T('راحة','Rest'))}</h3>
    <div class="sub">${next?H(next):T('استرخِ وتنفّس، وجهّز نفسك للجولة القادمة','Relax and breathe, get ready for the next round')}</div>
    <div class="row">
      <button class="p" data-rest="skip">${T('تخطي الراحة','Skip rest')}</button>
      <button data-rest="add">+ 30 ${T('ثانية','sec')}</button>
    </div>`;
  document.body.appendChild(el);
  beep(660,120); speak(T('ابتدأ وقت الراحة','Rest time started'));

  const paint=()=>{
    el.querySelector('.num').textContent=mmss(Math.max(0,left));
    el.querySelector('.fill').setAttribute('stroke-dashoffset', String(C*(1-Math.max(0,left)/total)));
    if(left<=10&&left>0){
      el.classList.add('hot');
      el.querySelector('#r_state').textContent=T('استعد للجولة القادمة','Get ready for the next round');
    }
  };
  paint();

  restT=setInterval(()=>{
    left--; paint();
    if(left<=10&&left>0){ beep(left<=3?1320:990,left<=3?130:90); if(left<=3) vibrate(70); }
    if(left<=0){
      chord([[880,0,.18],[1320,.14,.42]]); vibrate([160,80,160]);
      speak(T('انتهى وقت الراحة، ابدأ الجولة','Rest is over, start the round'));
      stopRest();
    }
  },1000);

  el.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-rest]'); if(!b) return;
    if(b.dataset.rest==='add'){ left+=30; paint(); el.classList.remove('hot'); }
    else stopRest();
  });
}
function stopRest(){
  clearInterval(restT); restT=null;
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(err){}
  document.querySelectorAll('.resting,.restfull').forEach(n=>n.remove());
}

function startEmom(w,d,i){
  const x=day(w,d).ex[i], total=x.emom.min;
  let min=1, sec=60, running=true;
  const el=document.createElement('div'); el.className='emomfull';
  document.body.appendChild(el);
  const draw=()=>{
    const odd = min%2===1;
    el.innerHTML=`<img class="emom-mark" src="${ASSET.MARK}" alt="">
      <div class="of">MINUTE ${min} / ${total}</div>
      <div class="min">${min}</div><div class="sec">${String(sec).padStart(2,'0')}</div>
      <div class="task">${H(PT(odd?x.emom.odd:x.emom.even))}</div>
      <div class="of" style="margin-top:8px">${odd?T('دقيقة فردية','Odd minute'):T('دقيقة زوجية','Even minute')}</div>
      <div class="row"><button class="p" data-em="pause">${running?T('إيقاف مؤقت','Paused'):T('متابعة','Continue')}</button><button data-em="end">${T('إنهاء','Finish')}</button></div>`;
  };
  draw();
  emomT=setInterval(()=>{
    if(!running) return;
    sec--;
    if(sec<=0){
      if(min>=total){ beep(520,400); vibrate([200,80,200]); endEmom(); toast(T('اكتمل الإيموم — أحسنت','EMOM complete — well done')); return; }
      min++; sec=60; beep(880,180); vibrate(120);
    }
    draw();
  },1000);
  el.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-em]'); if(!b) return;
    if(b.dataset.em==='pause'){ running=!running; draw(); }
    else { endEmom(); }
  });
}
function endEmom(){ clearInterval(emomT); emomT=null; document.querySelectorAll('.emomfull').forEach(n=>n.remove()); }

/* توقيع الشاشة الحالية — إن لم يتغيّر فالتحديث خلفي ويجب ألا يقفز للأعلى */
function viewSig(){
  return [UI.view, UI.sec||'', UI.focus||'', UI.week||'', UI.edit||'',
          UI.view==='apply'?('s'+(UI.step||0)):'',
          UI.session?UI.session.w+'-'+UI.session.d:''].join('|');
}
let VIEW_SIG=null;

function render(opts){
  const v=UI.view;
  applyAccent();
  const sig=viewSig();
  const sameScreen = (sig===VIEW_SIG) && !(opts&&opts.top);

  /* حفظ حالة الصفحة قبل إعادة البناء */
  const keepY = window.scrollY || window.pageYOffset || 0;
  const cb=document.getElementById('chatbody');
  const cbBottom = cb ? (cb.scrollHeight-cb.scrollTop-cb.clientHeight < 60) : true;
  const cbTop = cb?cb.scrollTop:0;
  const ae=document.activeElement;
  const keep = (ae && ae.id && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))
    ? {id:ae.id, val:ae.value, s:ae.selectionStart, e:ae.selectionEnd} : null;

  const needPin = ATH && !UI.focus && !AUTHED && (v==='train'||v==='session'||v==='progress'||v==='me'||v==='guide'||v==='chat');
  const gated = (v==='train'||v==='session'||v==='progress'||v==='me') && locked();
  const body = v==='join'?viewJoin(): v==='apply'?viewApply(): v==='ref'?viewRef():
               needPin?viewGate(): gated?viewLocked(): v==='me'?(ATH?viewMe():viewJoin()):
               v==='chat'?(ATH?viewChat():viewJoin()):
               v==='pick'?viewPick(): v==='session'?viewSession(): v==='progress'?viewProgress():
               v==='coach'?viewCoach(): v==='guide'?viewGuide(): (ATH?viewTrain():viewJoin());

  /* تلوين الواجهة الفعلي — بلا أي تغيير في المنطق، فقط ملفوف ليُشغَّل عبر
     View Transitions API عند توفّرها وعند وجود تنقّل حقيقي (لا إعادة رسم خلفية) */
  const paint = ()=>{
    $('#app').innerHTML=shell(body, v==='coach'&&UI.coachOK);
    paintNet();
    requestAnimationFrame(tickerFit);

    /* استعادة ما كان يكتبه المستخدم ومكان المؤشر */
    if(keep){
      const el=document.getElementById(keep.id);
      if(el){
        if(el.value!==keep.val) el.value=keep.val;
        try{ el.focus({preventScroll:true}); el.setSelectionRange(keep.s,keep.e); }catch(err){}
        if(el.id==='chatin'){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,140)+'px'; }
      }
    }
    /* استعادة موضع القراءة */
    if(sameScreen) window.scrollTo(0,keepY);
    else window.scrollTo(0,0);

    const nb=document.getElementById('chatbody');
    if(nb){ if(cbBottom||!sameScreen) nb.scrollTop=nb.scrollHeight; else nb.scrollTop=cbTop; }

    VIEW_SIG=sig;
    stickyCTA();
  };

  const isRealNav = !sameScreen;
  const canUseVT = isRealNav && !reducedMotion() && typeof document.startViewTransition==='function';
  if(canUseVT){
    try{ document.startViewTransition(paint); return; }catch(err){}
  }
  paint();
  if(isRealNav && !reducedMotion()){
    const app=$('#app');
    if(app){ app.classList.remove('nav-enter'); void app.offsetWidth; app.classList.add('nav-enter'); }
  }
}

/* شريط "سجّل بياناتك" الثابت — يظهر بعد تجاوز الواجهة ويختفي عند النموذج */
let CTA_SCROLL=null;
function stickyCTA(){
  if(CTA_SCROLL){ window.removeEventListener('scroll',CTA_SCROLL); CTA_SCROLL=null; }
  const bar=$('#stickycta'), form=$('#joinform');
  if(!bar||!form) return;
  CTA_SCROLL=()=>{
    const y=window.scrollY;
    const formTop=form.getBoundingClientRect().top+y;
    bar.classList.toggle('on', y>520 && y<formTop-260);
  };
  window.addEventListener('scroll',CTA_SCROLL,{passive:true});
  CTA_SCROLL();
}

  }

  const rn=t.closest('[data-reply-note]');
  if(rn){
    const n=allNotes()[+rn.dataset.replyNote];
    if(n){
      CHAT_REF={label:'W'+n.w+' — '+n.day+(n.ex?' · '+n.ex:''), t:n.t};
      render();
      setTimeout(()=>{ const b=$('#chatin'); if(b){ b.focus(); b.scrollIntoView({behavior:'smooth',block:'center'}); } },80);
    }
    return;
  }
  const qk=t.closest('[data-quick]');
  if(qk){
    const b=$('#chatin'); if(!b) return;
    b.value=(b.value?b.value.trim()+' ':'')+QUICK[+qk.dataset.quick];
    b.focus(); b.style.height='auto'; b.style.height=Math.min(b.scrollHeight,140)+'px';
    return;
  }
  const oc=t.closest('[data-open-chat]');
  if(oc){
    /* الردّ يتم في لوحة منبثقة فوق لوحة المدرب — بلا دخول لحساب المتدرب */
    const id=oc.dataset.openChat;
    if(!ROSTER.some(x=>x.id===id)) return;
    let ref=null;
    const key=oc.dataset.noteKey;
    if(key){
      const n=allAthNotes().find(x=>(x.id+'|'+x.ts)===key);
      if(n) ref=noteRef(n);
    }
    sheetChat(id,ref);
    return;
  }
  if(t.closest('[data-refresh-chats]')){ chatsLoadAll().then(()=>{ render(); toast(T('حُدّثت الرسائل','Messages refreshed')); }); return; }

  /* ---------- نموذج التسجيل المتدرّج ---------- */
  const sexBtn=t.closest('[data-sex]');
  if(sexBtn){ grabStep(); FORM.sex=sexBtn.dataset.sex; UI.stepErr=''; render(); return; }

  const calBtn=t.closest('[data-cal]');
  if(calBtn){
    grabStep();
    FORM.cal=calBtn.dataset.cal;
    if(FORM.cal==='hijri'){
      FORM.hd=FORM.hd||1; FORM.hm=FORM.hm||1; FORM.hy=FORM.hy||(hijriYearNow()-25);
      syncHijri();
    }else FORM.dob=FORM.dobG||'';
    UI.stepErr=''; render(); return;
  }

  const lvBtn=t.closest('[data-level]');
  if(lvBtn){ grabStep(); FORM.level=lvBtn.dataset.level; UI.stepErr=''; render(); return; }

  const dayBtn=t.closest('[data-days]');
  if(dayBtn){ grabStep(); FORM.days=dayBtn.dataset.days; render(); return; }

  const payBtn=t.closest('[data-pay]');
  if(payBtn){ grabStep(); FORM.pay=payBtn.dataset.pay; render(); return; }

  const spBtn=t.closest('[data-sport]');
  if(spBtn){
    grabStep();
    const v=spBtn.dataset.sport, NONE=T('لا أمارس حالياً','None right now');
    if(v===NONE) FORM.sports = FORM.sports.indexOf(v)>=0 ? [] : [NONE];
    else{
      FORM.sports=FORM.sports.filter(x=>x!==NONE);
      const k=FORM.sports.indexOf(v);
      if(k>=0) FORM.sports.splice(k,1); else FORM.sports.push(v);
    }
    UI.stepErr=''; render(); return;
  }

  const injBtn=t.closest('[data-inj]');
  if(injBtn){
    grabStep();
    const v=injBtn.dataset.inj;
    if(v==='لا يوجد') FORM.injTags = FORM.injTags.indexOf(v)>=0 ? [] : [T('لا يوجد','None')];
    else{
      FORM.injTags=FORM.injTags.filter(x=>x!=='لا يوجد');
      const k=FORM.injTags.indexOf(v);
      if(k>=0) FORM.injTags.splice(k,1); else FORM.injTags.push(v);
    }
    UI.stepErr=''; render(); return;
  }

  /* أزرار ± بجانب مؤشر الطول والوزن */
  const dl=t.closest('[data-dial]');
  if(dl){
    const parts=dl.dataset.dial.split(':'), key=parts[0], dir=+parts[1];
    const r=document.getElementById('j_'+key);
    if(r){
      r.value=Math.max(+r.min,Math.min(+r.max,(+r.value)+dir));
      FORM[key]=r.value;
      const lab=document.getElementById(key+'_v'); if(lab) lab.textContent=r.value;
      const bx=document.querySelector('.bmi');
      if(bx){ const h=+(FORM.h||0)/100,w=+(FORM.w||0);
        if(h&&w){ const b=w/(h*h);
          bx.querySelector('b').textContent=b.toFixed(1);
          bx.querySelector('span').textContent=T('مؤشر كتلة الجسم — ','Body mass index — ')+(b<18.5?T('أقل من الطبيعي','Below normal'):b<25?T('ضمن الطبيعي','Within normal'):b<30?T('زيادة بسيطة','Slight increase'):T('يحتاج عملاً على الوزن','Needs work on weight')); } }
    }
    return;
  }

  const goalBtn=t.closest('[data-goal]');
  if(goalBtn){
    grabStep();
    const g=goalBtn.dataset.goal, k=FORM.goalTags.indexOf(g);
    if(k>=0) FORM.goalTags.splice(k,1); else FORM.goalTags.push(g);
    UI.stepErr=''; render(); return;
  }
  const planBtn=t.closest('[data-planpick]');
  if(planBtn){ grabStep(); FORM.plan=planBtn.dataset.planpick; render(); return; }

  const stepBtn=t.closest('[data-step]');
  if(stepBtn){
    grabStep();
    const dir=+stepBtn.dataset.step;
    if(dir>0){
      const e=stepErr(UI.step||0);
      if(e){ UI.stepErr=e; render(); toast(e); return; }
    }
    UI.stepErr='';
    UI.step=Math.max(0,Math.min((UI.step||0)+dir,STEPS.length-1));
    render({top:true});
    return;
  }

  const op=t.closest('[data-open]');
  if(op){ UI.session={w:UI.week,d:+op.dataset.open}; UI.view='session'; render(); return; }

  if(t.closest('[data-goto-today]')){
    const ts=todaySession();
    if(ts){ UI.week=ts.w; UI.session={w:ts.w,d:ts.d}; UI.view='session'; render(); }
    else toast(T('اليوم يوم راحة — استفد منه للاستشفاء','Today is a rest day — use it to recover'));
    return;
  }

  if(t.closest('[data-back]')){ UI.view='train'; UI.session=null; render(); return; }

  const vd=t.closest('[data-vid]');
  if(vd){ sheetVideo(vd.dataset.vid, vd.dataset.name); return; }

  const st=t.closest('[data-set]');
  if(st){
    const [w,d,i,k]=st.dataset.set.split('-').map(Number);
    const l=log(w,d,i), on=!l.sets[k];
    l.sets[k]=on; l.ts=Date.now(); save();
    st.classList.toggle('on',on);
    const x=day(w,d).ex[i];
    if(on){
      vibrate(35); beep(760,70);
      const finished = l.sets.filter(Boolean).length>=x.s;
      if(finished){
        const st2=dayStats(w,d), whole = st2.done>=st2.total;
        if(whole){
          doneSound(); vibrate([120,70,120,70,220]);
          cheer({tag:'SESSION COMPLETE',ring:'100%',
                 title:SESSION_CHEERS[Math.floor(Math.random()*SESSION_CHEERS.length)],
                 sub:day(w,d).d+' — '+st2.total+T(' مجموعة مكتملة. لا تنسَ التهدئة وتسجيل ملاحظتك.',' sets completed. Do not skip the cool-down and your note.'),
                 btn:T('إنهاء الحصة','End the session')});
        }else{
          winSound(); vibrate([90,60,140]);
          cheer({tag:'EXERCISE COMPLETE',ring:x.s+'/'+x.s,
                 title:CHEERS[Math.floor(Math.random()*CHEERS.length)],
                 sub:x.n+' — '+st2.pct+T('% من الحصة','% of the session')});
        }
      }else if(x.r){ startRest(x.r, x.n+T(' — المجموعة ',' — set ')+(k+1)); }
      if(finished&&x.r) stopRest();
    }
    const stt=dayStats(w,d);
    const hero=$('.hero .chevbar');
    if(hero){[...hero.children].forEach((c,idx)=>c.classList.toggle('f',idx<Math.round(stt.pct/100*20)));}
    const p=document.querySelector('.hero p[style*="orange"]');
    if(p) p.textContent=stt.done+' / '+stt.total+T(' مجموعة',' sets');
    st.closest('.ex').classList.toggle('done', setsDone(w,d,i)>=x.s);
    return;
  }

  const dt=t.closest('[data-detail]');
  if(dt){ const [w,d,i]=dt.dataset.detail.split('-').map(Number); sheetDetail(w,d,i); return; }

  const sd=t.closest('[data-savedetail]');
  if(sd){
    const [w,d,i]=sd.dataset.savedetail.split('-').map(Number);
    const l=log(w,d,i);
    l.v=$('#dv').value.trim(); l.note=$('#dn').value.trim();
    const on=document.querySelector('#drate .on'); l.rpe=on?+on.dataset.rpe:null;
    l.ts=Date.now(); save(); closeSheet(); render(); toast(T('تم حفظ النتيجة','Result saved'));
    if(l.note && !UI.focus && ATH){
      pushSend('coach',T('💬 تعليق من ','💬 Comment from ')+ATH.name,
        ((day(w,d).ex[i]||{}).n?day(w,d).ex[i].n+' · ':'')+day(w,d).d+T(' · الأسبوع ',' · week ')+w+'\n'+l.note.slice(0,110),'note');
    }
    return;
  }

  const em=t.closest('[data-emom]');
  if(em){ const [w,d,i]=em.dataset.emom.split('-').map(Number); startEmom(w,d,i); return; }

  const ci=t.closest('[data-checkin]');
  if(ci){ sheetCheckin(+ci.dataset.checkin); return; }

  const sc=t.closest('[data-savecheck]');
  if(sc){
    const w=+sc.dataset.savecheck, rec=document.querySelector('#c_rec .on');
    S.checkins[w]={
      sleep:$('#c_sleep').value.trim(), weight:$('#c_weight').value.trim(),
      recovery:rec?rec.dataset.v:'', fl:$('#c_fl').value.trim(), bl:$('#c_bl').value.trim(),
      hspu:$('#c_hspu').value.trim(), mu:$('#c_mu').value.trim(), emom:$('#c_emom').value.trim()
    };
    save(); closeSheet(); render(); toast(T('تم حفظ تقييم الأسبوع ','Saved the rating for week ')+w);
    return;
  }

  if(t.closest('[data-daynote]')){ sheetDayNote(UI.session.w,UI.session.d); return; }
  const sdn=t.closest('[data-savedaynote]');
  if(sdn){
    const [w,d]=sdn.dataset.savedaynote.split('-').map(Number);
    S.logs['note-'+w+'-'+d]={note:$('#dayn').value.trim(),ts:Date.now(),sets:[]};
    save(); closeSheet(); toast(T('وصلت الملاحظة للمدرب','Your note reached the coach'));
    return;
  }

  if(t.closest('[data-lock]')){ try{localStorage.removeItem('reshape:coach');}catch(e){}
    CK=null; UI.coachOK=false; UI.view='pick'; UI.focus=null; UI.edit=null; render(); return; }
  if(t.closest('[data-export]')){ exportCSV(); return; }
  if(t.closest('[data-refresh]')){ toast(T('جارٍ التحديث…','Refreshing…')); pull(false); return; }

  const sh=t.closest('[data-sheet]');
  if(sh && (t.classList.contains('sheet')||t.classList.contains('close')||sh.classList.contains('fghost'))){
    SHEET_CHAT=null; CHAT_REF=null; closeSheet();
    if(UI.view==='coach') render();
  }
});

document.addEventListener('change',ev=>{
  const inp=ev.target.closest('[data-upload]'); if(!inp) return;
  const kind=inp.dataset.upload, f=inp.files&&inp.files[0]; if(!f) return;
  if(kind!=='bill' && (!ATH||locked()||!AUTHED)){ toast(T('لا يمكن الرفع الآن','Cannot upload right now')); return; }
  toast(T('جارٍ معالجة الصورة…','Processing the photo…'));
  if(kind==='bill'){
    toast(T('جارٍ معالجة الصورة…','Processing the photo…'));
    pickImage(f,1200,.68).then(data=>{ BILL=data;
      const l=document.getElementById('j_bill_l'); if(l) l.textContent=T('✅ أُرفقت صورة الفاتورة — اضغط لتغييرها','✅ Receipt photo attached — tap to change it');
      toast(T('أُرفقت الفاتورة','Receipt attached')); }).catch(()=>toast(T('تعذّرت قراءة الصورة','Could not read the photo')));
    return;
  }
  const big = kind==='inbody';
  pickImage(f, big?1400:320, big?.72:.8).then(data=>{
    const p=prof();
    if(kind==='avatar') p.avatar=data;
    else{ p.inbody=p.inbody||[]; p.inbody.unshift({img:data,date:new Date().toLocaleDateString(LOCALE(),{day:'numeric',month:'long',year:'numeric'}),ts:Date.now()}); }
    save(); if(kind==='inbody') mediaSave();
    render(); toast(kind==='avatar'?T('تم تحديث صورتك','Your photo was updated'):T('أُضيف تقرير InBody','InBody report added'));
  }).catch(()=>toast(T('تعذّرت قراءة الصورة','Could not read the photo')));
});

document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ closeSheet(); endEmom(); } });

/* المحادثة: Enter يرسل، Shift+Enter سطر جديد، والمربع يتمدد مع النص */
/* تاريخ الميلاد — يعرض العمر فور اختياره */
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t && t.id==='j_dob'){ grabStep(); FORM.dobG=FORM.dob; UI.stepErr=''; render(); return; }
  const hj=t && t.closest && t.closest('[data-hij]');
  if(hj){ FORM[hj.dataset.hij]=+hj.value; syncHijri(); UI.stepErr=''; render(); }
});
document.addEventListener('keydown',ev=>{
  if(ev.target && ev.target.id==='chatin' && ev.key==='Enter' && !ev.shiftKey){
    ev.preventDefault();
    const btn=document.querySelector('[data-chat-send]');
    if(btn) btn.click();
  }
});
/* سحب مؤشر الطول/الوزن — تحديث فوري بدون إعادة بناء الشاشة */
document.addEventListener('input',ev=>{
  const r=ev.target && ev.target.closest && ev.target.closest('[data-rng]');
  if(r){
    const key=r.dataset.rng;
    FORM[key]=r.value;
    const lab=document.getElementById(key+'_v'); if(lab) lab.textContent=r.value;
    const bx=document.querySelector('.bmi');
    if(bx){
      const h=+(FORM.h||0)/100, w=+(FORM.w||0);
      if(h&&w){ const b=w/(h*h);
        bx.querySelector('b').textContent=b.toFixed(1);
        bx.querySelector('span').textContent=T('مؤشر كتلة الجسم — ','Body mass index — ')+
          (b<18.5?T('أقل من الطبيعي','Below normal'):b<25?T('ضمن الطبيعي','Within normal'):b<30?T('زيادة بسيطة','Slight increase'):T('يحتاج عملاً على الوزن','Needs work on weight'));
      }
    }
    return;
  }
  if(ev.target && ev.target.id==='chatin'){
    ev.target.style.height='auto';
    ev.target.style.height=Math.min(ev.target.scrollHeight,140)+'px';
  }
});

(async function init(){
  try{ const sv=localStorage.getItem('reshape:theme'); applyTheme(sv==='light'?'light':'dark'); }catch(err){ applyTheme('dark'); }
  $('#app').innerHTML=shell(T('<div class="empty" style="margin-top:40px">جارٍ التحميل…</div>','<div class="empty" style="margin-top:40px">Loading…</div>'));
  try{
    await rosterLoad();
    await progsLoad();
    await subsLoad();
    await alertsLoad();
    await annLoad();
    await leadsLoad();
    await refsLoad();
    const qs=new URLSearchParams(location.search);
    const refCode=qs.get('ref');
    if(refCode){                                   /* رابط صديق — يعبّئ الكود ويفتح التسجيل */
      FORM.ref=String(refCode).trim().toUpperCase();
      lset('reshape:refin',FORM.ref);
    } else {
      const saved=lget('reshape:refin'); if(saved) FORM.ref=saved;
    }
    const page=qs.get('p');
    const trackCode=qs.get('c');
    if(trackCode) lset('reshape:mycode',String(trackCode).trim().toUpperCase());
    const q=qs.get('a');
    const a=q?ROSTER.find(x=>x.id===q):null;
    if(!a && lget('reshape:coach')){
      CK=COACH_CODE; UI.coachOK=true; UI.view='coach'; UI.sec='overview';
      render(); setTimeout(()=>{ alertWatch(); pullAll(false); },600);
      const sp0=document.getElementById('splash');
      if(sp0){ setTimeout(()=>{sp0.classList.add('out'); setTimeout(()=>sp0.remove(),500);},700); }
      return;
    }
    let a2=a;
    if(!a2){ const last=lget('reshape:last'); if(last) a2=ROSTER.find(x=>x.id===last)||null; }
    if(a2){ await openAthlete(a2); UI.view = AUTHED?'train':'pick'; if(AUTHED) setTimeout(greet,1500); }
    else UI.view='join';
    /* صفحة البرنامج المستقلة: ?p=ref — ورابط الصديق ?ref=CODE يفتح التسجيل بكوده */
    if(page==='ref') UI.view='ref';
    else if(refCode && !a2){ UI.view='apply'; UI.step=0; setTimeout(()=>toast(T('كود الخصم مُطبّق: ','Discount code applied: ')+FORM.ref),1200); }
  }catch(err){ NET.state='err'; UI.view='join'; }
  applyLang();
  render();
  setInterval(()=>{
    const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(UI.view==='coach'&&UI.coachOK&&!UI.edit&&!$('#layer').innerHTML&&!busy){ UI.focus?pull(false):pullAll(false); }
  },20000);
  try{ LAST_SEEN=+(lget('reshape:lastseen')||0); }catch(e){}
  setInterval(alertWatch,45000);
  setInterval(chatWatch,10000);                        // المحادثة الفورية
  setTimeout(chatWatch,4000);
  setInterval(idleWatch,1800000);                      // فحص الانقطاع كل نصف ساعة
  setTimeout(idleWatch,8000);                          // وفحص أول عند فتح اللوحة
  setInterval(noteWatch,60000);                        // تعليقات التمارين الجديدة
  setTimeout(noteWatch,9000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ alertWatch(); idleWatch(); chatWatch(); noteWatch(); } });
  setInterval(()=>{ if(NET.state==='err'&&cloudOn()&&ATH&&!UI.focus&&!locked()) save(); },30000);
  setInterval(()=>{ if(ATH&&!UI.focus&&locked()){ subsLoad().then(()=>{ WRITE_BLOCKED=false; render(); }); } },60000);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&UI.view==='coach'&&UI.coachOK){ UI.focus?pull(false):pullAll(false); }
  });
  setTimeout(()=>remindAthlete(false),1600);
  setInterval(()=>remindAthlete(false),3600000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(()=>remindAthlete(false),600); });
  const sp=document.getElementById('splash');
  if(sp){ setTimeout(()=>{sp.classList.add('out'); setTimeout(()=>sp.remove(),500);},900); }
})();
</script>
