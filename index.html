<style>
:root{
  --ink:#17181A;
  --charcoal:#2F3034;
  --gray:#444448;
  --line:#3A3B40;
  --warm:#D9CCC4;
  --soft:#E9DDD7;
  --strong:#FFFFFF;
  --onDark:#FFFFFF;
  --c1:#FF5420; --c2:#3FA0C4; --c3:#4FB183; --c4:#A87BC7; --c5:#E8B04B; --c6:#E4573C;
  --orange:#FF5420;
  --orange-dim:rgba(255,84,32,.14);
  --muted:#8A8B90;
  --card1:#26272B; --card2:#212226;
  --surf:#202124; --surf2:#1A1B1E;
  --sunken:rgba(0,0,0,.28);
  --field:#141416; --panel:#1D1E21; --deep:#111113;
  --track:#2A2B2F;
  --scrim:rgba(10,10,11,.72);
  --onAccent:#141416;
  --toastbg:#E9DDD7; --toastfg:#141416;
  --danger:#5B2116; --danger-line:#7A2B1C;
  --grain:rgba(255,255,255,.022);
  --glow:rgba(255,84,32,.10);
  --logofx:none;
  --radius:14px;
  --ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --disp:'Zain','IBM Plex Sans Arabic',sans-serif;
  --data:'Barlow Semi Condensed','IBM Plex Sans Arabic',sans-serif;

  /* ---------- semantic status ---------- */
  --ok:#4FB183; --ok-dim:rgba(79,177,131,.14);
  --warn:#E8B04B; --warn-dim:rgba(232,176,75,.14);
  --bad:#E4573C; --bad-dim:rgba(228,87,60,.14);
  --focus-ring:var(--orange);

  /* ---------- elevation ---------- */
  --e1:0 1px 2px rgba(0,0,0,.22);
  --e2:0 6px 20px rgba(0,0,0,.26);
  --e3:0 16px 40px rgba(0,0,0,.34);
  --ring-accent:0 0 0 3px var(--orange-dim);

  /* ---------- spacing scale ---------- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px;

  /* ---------- motion tokens ---------- */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-micro:140ms;
  --dur-ui:220ms;
  --dur-reveal:380ms;
  --dur-cheer:650ms;
}
html[data-theme="light"] h1,
html[data-theme="light"] h2,
html[data-theme="light"] h3{color:#1B1A1B;letter-spacing:-.01em}
html[data-theme="light"] .eyebrow{color:#1B1A1B}
html[data-theme="light"] .hero p{color:#4A423D}
html[data-theme="light"] .card{box-shadow:0 1px 2px rgba(36,34,35,.05)}
html[data-theme="light"] .day .dnum{color:#B7A99D}
html[data-theme="light"] .day.complete .dnum{color:var(--orange)}
html[data-theme="light"]{
  --ink:#EFE7DF;
  --charcoal:#242223;
  --gray:#6B635C;
  --line:#DCCFC4;
  --warm:#5C544E;
  --soft:#242223;
  --strong:#17181A;
  --onDark:#FFFFFF;
  --c1:#E8401D; --c2:#2E7F9E; --c3:#3B8C64; --c4:#8452A8; --c5:#C08A22; --c6:#C9402A;
  --orange:#E8401D;
  --orange-dim:rgba(232,64,29,.10);
  --muted:#8B817A;
  --card1:#FFFFFF; --card2:#FAF4EE;
  --surf:#F7F0E9; --surf2:#F3EAE2;
  --sunken:rgba(0,0,0,.045);
  --field:#FFFFFF; --panel:#FCF7F2; --deep:#FFFFFF;
  --track:#E2D5C9;
  --scrim:rgba(46,40,36,.42);
  --onAccent:#FFFFFF;
  --toastbg:#242223; --toastfg:#F8F0E8;
  --danger:#B23A21; --danger-line:#8E2C17;
  --grain:rgba(36,34,35,.035);
  --glow:rgba(232,64,29,.09);
  --logofx:brightness(.28) saturate(0);

  --ok:#3B8C64; --ok-dim:rgba(59,140,100,.12);
  --warn:#C08A22; --warn-dim:rgba(192,138,34,.12);
  --bad:#B23A21; --bad-dim:rgba(178,58,33,.10);

  --e1:0 1px 2px rgba(36,34,35,.06);
  --e2:0 8px 22px rgba(36,34,35,.09);
  --e3:0 18px 42px rgba(36,34,35,.14);
  --ring-accent:0 0 0 3px var(--orange-dim);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--ink)}
body{
  background:var(--ink);color:var(--soft);font-family:var(--ar);
  font-size:15px;line-height:1.55;overflow-x:hidden;min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(115deg,var(--grain) 0 2px,transparent 2px 26px),
    radial-gradient(120% 60% at 80% -10%,var(--glow),transparent 60%);
}
#app{position:relative;z-index:1}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*:not(.splash){animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
.wrap.wide{max-width:1080px}

.topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--ink) 84%,transparent));
  border-bottom:1px solid var(--line);
}
.topbar .inner{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px}
.mark{width:26px;height:26px;flex:none}
.wordmark{
  font-family:var(--data);font-style:italic;font-weight:700;font-size:24px;
  letter-spacing:-.01em;color:var(--soft);line-height:1
}
.wordmark sup{font-size:9px;vertical-align:super;color:var(--muted);font-style:normal}
.who{margin-inline-start:auto;text-align:end;line-height:1.15;background:none;border:0;padding:0}
.who b{display:block;font-size:13px;font-weight:600}
.who span{font-size:11px;color:var(--muted);letter-spacing:.04em}

.tabs{display:flex;gap:4px;max-width:1080px;margin:0 auto;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.sectabs{gap:6px;overflow-x:auto;padding-bottom:10px!important}
.sectabs .tab{flex:0 0 auto;min-width:auto;padding:9px 14px;font-size:13.5px;border:1px solid var(--line);background:var(--surf2)}
.sectabs .tab.on{background:var(--orange);border-color:var(--orange);color:var(--onAccent)}
.sectabs .tab.on::before{content:""}
.tab{
  flex:1;min-width:78px;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:600;
  color:var(--muted);white-space:nowrap;text-align:center;border:1px solid transparent;transition:.15s
}
.tab.on{color:var(--onDark);background:var(--charcoal);border-color:var(--charcoal);font-weight:700}
.tab.on::before{content:"/ ";color:var(--orange)}

/* ---------- typographic devices ---------- */
.eyebrow{
  font-family:var(--ar);font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;
  color:var(--strong);display:flex;align-items:center;gap:8px;margin:26px 0 10px
}
.eyebrow::before{content:"/";color:var(--orange);font-style:italic;font-weight:700;letter-spacing:0}
h1,h2,h3{font-family:var(--disp);font-weight:900;margin:0;line-height:1.15}
h1{font-size:30px}
h2{font-size:22px}
h3{font-size:17px}
.hair{height:1px;background:var(--line);margin:18px 0}
.hair.accent{background:linear-gradient(90deg,var(--orange),transparent 55%)}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg,var(--card1),var(--card2));
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  position:relative;overflow:hidden
}
.card.flat{background:var(--surf)}
.card .chev{position:absolute;inset-inline-end:-18px;top:-18px;width:96px;opacity:.05;pointer-events:none}

/* hero */
.hero{padding:22px 18px 18px}
.hero .phase{font-family:var(--data);font-style:italic;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
.hero h1{margin:6px 0 4px}
.hero p{margin:6px 0 0;color:var(--warm);font-size:13.5px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.metric{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.metric b{display:block;font-family:var(--data);font-size:24px;font-weight:600;line-height:1;color:var(--strong)}
.metric span{font-size:10.5px;color:var(--muted);letter-spacing:.05em}

/* ---------- chevron progress (signature) ---------- */
.chevbar{display:flex;gap:3px;margin-top:14px}
.chevbar i{
  flex:1;height:12px;background:var(--gray);opacity:.55;
  clip-path:polygon(0 0,72% 0,100% 50%,72% 100%,0 100%,28% 50%);
  transition:background .25s,opacity .25s
}
.chevbar i.f{background:var(--orange);opacity:1}

/* ---------- week strip ---------- */
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.week{
  border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:10px 6px;text-align:center;transition:.15s
}
.week b{display:block;font-family:var(--data);font-size:22px;font-weight:600;line-height:1}
.week span{font-size:10px;color:var(--muted);display:block;margin-top:3px}
.week.on{background:var(--orange);border-color:var(--orange);color:var(--onAccent)}
.week.on span{color:rgba(0,0,0,.62)}
.week.done{border-color:var(--orange)}

/* ---------- day cards ---------- */
.day{display:flex;align-items:center;gap:12px;width:100%;text-align:start}
.day .dnum{
  font-family:var(--data);font-style:italic;font-weight:700;font-size:30px;color:var(--gray);line-height:1;min-width:34px
}
.day.complete .dnum{color:var(--orange)}
.day .dinfo{flex:1;min-width:0}
.day .dinfo b{display:block;font-size:15px;font-weight:700}
.day .dinfo span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.arrow{color:var(--orange);font-size:18px;font-family:var(--data);font-weight:700}

/* ---------- exercise ---------- */
.ex{padding:14px 14px 12px}
.ex.done{border-color:rgba(255,84,32,.5)}
.ex-top{display:flex;gap:10px;align-items:flex-start}
.ex-title{flex:1;min-width:0}
.ex-title .en{
  font-family:var(--data);font-weight:600;font-size:17px;letter-spacing:.01em;color:var(--strong);display:block
}
.ex-title .ar{font-size:12.5px;color:var(--warm);display:block;margin-top:1px}
.tagfocus{
  font-size:10.5px;letter-spacing:.04em;color:var(--orange);background:var(--orange-dim);
  border:1px solid rgba(255,84,32,.28);border-radius:999px;padding:2px 9px;white-space:nowrap;margin-top:3px;display:inline-block
}
.vidbtn{
  flex:none;width:42px;height:42px;border-radius:11px;background:var(--deep);border:1px solid var(--line);
  display:grid;place-items:center;transition:.15s
}
.vidbtn:hover{border-color:var(--orange);background:var(--surf2)}
.vidbtn svg{width:16px;height:16px;fill:var(--orange)}

.specs{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 0}
.spec{background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;color:var(--warm)}
.spec b{font-family:var(--data);font-size:14px;font-weight:600;color:var(--strong);margin-inline-start:4px}

.emom-box{margin-top:11px;border:1px dashed rgba(255,84,32,.4);border-radius:10px;padding:10px 11px;background:rgba(255,84,32,.05)}
.emom-box div{font-size:12.5px}
.emom-box .k{font-family:var(--data);font-weight:600;color:var(--orange);font-size:13px;margin-inline-end:6px}

.sets{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;align-items:center}
.setbtn{
  width:42px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surf2);
  font-family:var(--data);font-size:16px;font-weight:600;color:var(--muted);transition:.15s
}
.setbtn.on{background:var(--orange);border-color:var(--orange);color:var(--onAccent)}
.setbtn:active{transform:scale(.94)}
.logbtn{
  margin-inline-start:auto;font-size:12px;color:var(--warm);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;background:var(--surf2)
}
.logbtn.has{border-color:rgba(255,84,32,.5);color:var(--orange)}

/* ---------- forms ---------- */
label.f{display:block;font-size:13px;font-weight:700;color:var(--strong);margin:14px 0 6px;letter-spacing:0}
.inp,textarea.inp,select.inp{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;color:var(--soft)
}
.inp:focus{border-color:var(--orange);outline:none}
textarea.inp{min-height:74px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  display:block;width:100%;background:var(--orange);color:var(--onAccent);font-weight:700;
  border-radius:11px;padding:13px;font-size:15px;margin-top:16px;transition:.15s
}
.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--warm);font-weight:600}
.rate{display:flex;gap:7px}
.rate button{
  flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--field);
  font-family:var(--data);font-size:17px;font-weight:600;color:var(--muted)
}
.rate button.on{background:var(--orange);border-color:var(--orange);color:var(--onAccent)}

/* ---------- sheet / modal ---------- */
.sheet{
  position:fixed;inset:0;z-index:80;background:var(--scrim);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center
}
.sheet .panel{
  width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px 30px;
  animation:up .22s ease
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grip{width:42px;height:4px;border-radius:9px;background:var(--gray);margin:0 auto 14px}
.sheet .close{position:absolute;inset-inline-end:16px;top:14px;color:var(--muted);font-size:22px;line-height:1}
.vidframe{position:relative;width:100%;aspect-ratio:9/16;max-height:62vh;background:#000;border-radius:12px;overflow:hidden;margin-top:6px}
.vidframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- rest timer ---------- */
.resting{
  position:fixed;bottom:0;inset-inline:0;z-index:70;background:var(--deep);border-top:1px solid var(--orange);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;
  max-width:560px;margin:0 auto
}
.resting .t{font-family:var(--data);font-size:30px;font-weight:600;color:var(--orange);line-height:1;min-width:64px}
.resting .lbl{flex:1;font-size:12px;color:var(--muted)}
.resting button{font-size:12px;color:var(--warm);border:1px solid var(--line);padding:7px 11px;border-radius:8px}
.rprog{position:absolute;top:0;inset-inline-start:0;height:2px;background:var(--orange);transition:width 1s linear}

/* ---------- emom overlay ---------- */
.emomfull{position:fixed;inset:0;z-index:90;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.emomfull .min{font-family:var(--data);font-size:96px;font-weight:600;line-height:.9;color:var(--strong)}
.emomfull .sec{font-family:var(--data);font-size:64px;font-weight:600;color:var(--orange);line-height:1}
.emomfull .task{font-size:19px;font-weight:700;margin-top:14px;max-width:340px}
.emomfull .of{font-size:12px;color:var(--muted);letter-spacing:.2em;font-family:var(--data)}
.emomfull .row{display:flex;gap:10px;margin-top:26px}
.emomfull .row button{border:1px solid var(--line);border-radius:10px;padding:11px 20px;font-weight:600;color:var(--warm)}
.emomfull .row button.p{background:var(--orange);color:var(--onAccent);border-color:var(--orange)}

/* ---------- coach ---------- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi .card{margin:0;padding:14px}
.kpi b{font-family:var(--data);font-size:32px;font-weight:600;color:var(--strong);display:block;line-height:1}
.kpi span{font-size:11px;color:var(--muted)}
.kpi em{font-style:normal;color:var(--orange);font-size:12px;font-family:var(--data)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{
  text-align:start;font-family:var(--ar);font-size:12px;letter-spacing:0;
  color:var(--muted);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap
}
table.t td{padding:10px 8px;border-bottom:1px solid rgba(58,59,64,.5);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.pill{font-family:var(--data);font-size:13px;padding:2px 8px;border-radius:999px;background:var(--orange-dim);color:var(--orange)}
.bar{height:8px;border-radius:9px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange)}
.scroll{overflow-x:auto}
.note{font-size:12.5px;color:var(--warm);background:var(--surf2);border:1px solid var(--line);border-left:2px solid var(--orange);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.note b{font-family:var(--data);color:var(--strong);font-size:13px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 12px;border:1px dashed var(--line);border-radius:12px}

/* ---------- guide ---------- */
.gtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.gtable th{background:var(--track);color:var(--warm);font-size:11.5px;padding:8px;text-align:start;font-weight:600}
.gtable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.gtable td:first-child{font-family:var(--data);font-size:15px;color:var(--orange);font-weight:600}


.net{
  display:inline-block;font-family:var(--data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-top:3px
}
.net.ok{color:var(--orange);border-color:rgba(255,84,32,.45);background:var(--orange-dim)}
.net.saving{color:var(--warm)}
.net.err{color:var(--onDark);background:var(--danger);border-color:var(--danger-line)}
.setup{border-color:rgba(255,84,32,.45)}
.setup code{
  display:block;background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:6px;
  font-family:var(--data);font-size:13px;color:var(--orange);direction:ltr;text-align:left;overflow-x:auto;white-space:pre
}
/* ---------- bank transfer ---------- */
.bankrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.bankrow:last-child{border-bottom:0}
.bankrow span{font-size:12px;color:var(--muted);flex:none;min-width:88px}
.bankrow b{flex:1;font-family:var(--data);font-size:16px;color:var(--strong);direction:ltr;text-align:left;word-break:break-all}
.bankrow button{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:11.5px;color:var(--orange);flex:none}
.bankqr{width:190px;display:block;margin:0 auto;border-radius:12px;background:#fff;padding:10px}
.fastbadge{
  display:inline-flex;align-items:center;gap:7px;background:var(--c3);color:#fff;font-weight:700;font-size:12.5px;
  border-radius:999px;padding:6px 14px;margin-bottom:10px
}
.disc{max-height:150px;overflow:auto;background:var(--surf2);border:1px solid var(--line);border-radius:11px;
  padding:12px;font-size:12px;color:var(--warm);line-height:1.85}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer}
.agree input{width:22px;height:22px;flex:none;accent-color:var(--orange);margin-top:2px}
.agree span{font-size:12.5px;color:var(--soft)}
/* ---------- join page ---------- */
.step .ic{
  flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--orange-dim);border:1px solid rgba(255,84,32,.32)
}
.step .ic svg{width:20px;height:20px;fill:none;stroke:var(--orange);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.step .num{
  position:absolute;margin-top:-6px;margin-inline-start:-6px;width:19px;height:19px;border-radius:50%;
  background:var(--orange);color:var(--onAccent);font-family:var(--data);font-size:11px;font-weight:600;
  display:grid;place-items:center
}
.paylogos{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.paylogos img{height:38px;width:auto;border-radius:9px}
.shotframe{
  border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surf2);margin-top:10px
}
.shotframe .top{
  display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--charcoal);border-bottom:1px solid var(--line)
}
.shotframe .top i{width:9px;height:9px;border-radius:50%;background:var(--gray);display:block}
.shotframe .top span{margin-inline-start:auto;font-family:var(--data);font-size:11px;color:var(--muted);letter-spacing:.1em}
.shotframe .body{padding:12px;background:var(--ink)}
.demo{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:12px;padding:12px}
.demo .en2{font-family:var(--data);font-size:16px;color:var(--strong);display:block}
.demo .ar2{font-size:12px;color:var(--warm);display:block;margin-top:1px}
.demo .sp{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.demo .sp span{background:var(--surf2);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:10.5px;color:var(--warm)}
.demo .sp b{font-family:var(--data);font-size:12.5px;color:var(--strong);margin-inline-start:3px}
.demo .setrow{display:flex;gap:6px;margin-top:11px;align-items:center}
.demo .setrow u{
  width:34px;height:31px;border-radius:8px;border:1px solid var(--line);background:var(--surf2);
  display:grid;place-items:center;font-family:var(--data);font-size:14px;color:var(--muted);text-decoration:none
}
.demo .setrow u.on{background:var(--orange);border-color:var(--orange);color:var(--onAccent)}
.jhero{padding:26px 18px 22px;text-align:center}
.jhero .logo-primary{height:34px;margin:0 auto 14px}
.jhero h1{font-size:30px;line-height:1.2}
.jhero p{margin:10px auto 0;max-width:420px;font-size:14px}
.steps{counter-reset:st}
.step{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step i{
  counter-increment:st;flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:var(--orange-dim);border:1px solid rgba(255,84,32,.35);color:var(--orange);
  font-family:var(--data);font-size:16px;font-weight:600;font-style:normal
}
.step i::before{content:counter(st)}
.step b{display:block;font-size:14.5px}
.step span{font-size:12.5px;color:var(--warm)}
/* ===== لمسة بنفسجية عند اختيار «أنثى» ===== */
html[data-accent="fem"]{
  --orange:#B87BDD;
  --orange-dim:rgba(184,123,221,.16);
  --onAccent:#1B1226;
  --glow:rgba(184,123,221,.10);
  --c1:#B87BDD;
}
html[data-theme="light"][data-accent="fem"]{
  --orange:#8B4BB8;
  --orange-dim:rgba(139,75,184,.10);
  --onAccent:#FFFFFF;
  --glow:rgba(139,75,184,.08);
  --c1:#8B4BB8;
}
html[data-accent="fem"] .jumpnow{box-shadow:0 6px 20px rgba(184,123,221,.26)}
html[data-accent="fem"] .plan.best,
html[data-accent="fem"] .chip.on,
html[data-accent="fem"] .pp.on,
html[data-accent="fem"] .opt.on{border-color:rgba(184,123,221,.55)}
html[data-accent="fem"] .seg.on{box-shadow:0 3px 12px rgba(184,123,221,.28)}
/* انتقال ناعم عند تغيّر اللون بدل قفزة مفاجئة */
.seg,.chip,.pill,.opt,.pp,.btn,.sect,.wizbar i{transition:background-color .3s ease,border-color .3s ease,color .3s ease}

.langbtn{font-family:var(--data);font-size:12.5px;font-weight:700;letter-spacing:.03em}
.segs.sm{margin-bottom:10px}
.segs.sm .seg{padding:10px;font-size:12.5px}
.hijri3{display:grid;grid-template-columns:.85fr 1.3fr .85fr;gap:7px}
.hijri3 .f{margin:0 0 5px}
.hijri3 select{margin:0}
html[dir="ltr"] .review b{text-align:right}
html[dir="ltr"] .opt span{text-align:right}
html[dir="ltr"] .sendbtn svg{transform:none}
html[dir="ltr"] .dial-ends{flex-direction:row-reverse}

/* --- مؤشر السحب للطول والوزن --- */
.dial{background:var(--sunken);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:12px}
.dial-v{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 4px}
.dial-v span{font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:5px}
.dial-v b{font-family:var(--data);font-size:34px;color:var(--orange);line-height:1}
.dstep{
  width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:var(--surf);color:var(--orange);font-size:20px;font-family:inherit;cursor:pointer;line-height:1
}
.rng{
  width:100%;margin:6px 0 2px;-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;
  background:linear-gradient(to left,var(--orange),rgba(255,84,32,.25));outline:none
}
.rng::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--orange);
  border:3px solid var(--surf);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)
}
.rng::-moz-range-thumb{
  width:24px;height:24px;border-radius:50%;background:var(--orange);
  border:3px solid var(--surf);cursor:pointer
}
.dial-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}

/* --- بطاقات اختيار (المستوى / الدفع) --- */
.opts{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.opt{
  display:flex;align-items:center;gap:10px;text-align:start;width:100%;
  border:1px solid var(--line);background:transparent;border-radius:11px;padding:12px 14px;
  font-family:inherit;cursor:pointer;color:var(--warm)
}
.opt b{font-size:13.5px;flex:none}
.opt span{font-size:11.5px;color:var(--muted);flex:1;text-align:end}
.opt.on{background:var(--orange-dim);border-color:rgba(255,84,32,.55)}
.opt.on b{color:var(--orange)}

/* --- أزرار الأيام --- */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{
  flex:1;min-width:72px;border:1px solid var(--line);background:transparent;color:var(--warm);
  border-radius:10px;padding:11px 6px;font-size:12.5px;font-family:inherit;cursor:pointer
}
.pill.on{background:var(--orange);color:var(--onAccent);border-color:var(--orange);font-weight:700}

.agebox{display:flex;align-items:baseline;gap:7px;justify-content:center;background:var(--sunken);
  border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:10px}
.agebox b{font-family:var(--data);font-size:24px;color:var(--orange)}
.agebox span{font-size:12px;color:var(--muted)}
.opt-n{font-size:10.5px;color:var(--muted);font-weight:400}
input[type="date"].inp{min-height:48px}

/* ============ نموذج التسجيل المتدرّج ============ */
.wizhead{
  display:flex;align-items:center;gap:12px;margin:4px 0 12px;padding:12px 14px;
  background:var(--surf);border:1px solid var(--line);border-radius:13px
}
.wizhead>div{flex:1;min-width:0}
.wizhead span{display:block;font-size:11px;color:var(--orange);font-weight:700;letter-spacing:.04em}
.wizhead b{display:block;font-size:22px;margin-top:3px}
.wizx{
  width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:16px;cursor:pointer
}
.wizbar{display:flex;gap:5px;margin-bottom:14px}
.wizbar i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.wizbar i.done{background:rgba(255,84,32,.5)}
.wizbar i.now{background:var(--orange)}
.wizsub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.wizerr{
  font-size:12.5px;color:#E4573C;background:rgba(228,87,60,.1);
  border:1px solid rgba(228,87,60,.3);border-radius:9px;padding:10px 12px;margin:14px 0 0
}
.wiznav{display:flex;gap:9px;margin-top:16px}
.wiznav .btn{flex:1;margin:0}
.hintline{font-size:11.5px;color:var(--muted);margin:7px 0 0;line-height:1.7}

.segs{display:flex;gap:9px;margin-top:2px}
.seg{
  flex:1;padding:14px;border-radius:11px;border:1px solid var(--line);background:transparent;
  color:var(--warm);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer
}
.seg.on{background:var(--orange);color:var(--onAccent);border-color:var(--orange)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.chip{
  background:transparent;border:1px solid var(--line);color:var(--warm);border-radius:999px;
  padding:8px 13px;font-size:12px;font-family:inherit;cursor:pointer
}
.chip.on{background:var(--orange-dim);border-color:rgba(255,84,32,.5);color:var(--orange);font-weight:700}

.planpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:2px}
.pp{
  border:1px solid var(--line);background:transparent;border-radius:11px;padding:12px 8px;
  text-align:center;font-family:inherit;cursor:pointer;color:var(--warm)
}
.pp b{display:block;font-size:13.5px;color:var(--soft,inherit)}
.pp span{display:block;font-family:var(--data);font-size:16px;color:var(--orange);margin-top:4px}
.pp i{display:block;font-family:var(--data);font-size:11px;color:var(--muted);text-decoration:line-through;font-style:normal}
.pp.on{background:var(--orange-dim);border-color:rgba(255,84,32,.55)}

.bmi{display:flex;align-items:center;gap:11px;background:var(--sunken);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin-top:11px}
.bmi b{font-family:var(--data);font-size:21px;color:var(--orange)}
.bmi span{font-size:11.5px;color:var(--muted)}

.review{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:14px}
.review div{display:flex;justify-content:space-between;gap:10px;padding:10px 13px;font-size:12.5px}
.review div:nth-child(odd){background:var(--sunken)}
.review span{color:var(--muted)}
.review b{text-align:left;max-width:62%}

/* بطاقة الدعوة للتسجيل في الصفحة الرئيسية */
.applycta{border-color:rgba(255,84,32,.4)}
.ac-badge{
  display:inline-block;background:var(--orange-dim);color:var(--orange);border:1px solid rgba(255,84,32,.3);
  border-radius:999px;padding:4px 11px;font-size:10.5px;font-weight:800;letter-spacing:.03em
}
.ac-top b{display:block;font-size:18px;margin-top:10px;line-height:1.55}
.ac-top p{font-size:12.5px;color:var(--muted);margin:7px 0 0;line-height:1.8}
.ac-steps{display:flex;gap:5px;margin:14px 0 4px}
.ac-steps span{
  flex:1;text-align:center;font-size:9.5px;color:var(--muted);line-height:1.5
}
.ac-steps i{
  display:block;width:26px;height:26px;line-height:26px;margin:0 auto 5px;border-radius:50%;
  background:var(--sunken);border:1px solid var(--line);color:var(--orange);
  font-family:var(--data);font-size:12px;font-style:normal;font-weight:700
}

/* ================= المحادثة ================= */
.chatwrap{border:1px solid var(--line);border-radius:14px;background:var(--surf);overflow:hidden}
.chatbody{
  max-height:56vh;min-height:200px;overflow-y:auto;padding:14px 12px;
  display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth
}
.chat-empty{text-align:center;padding:34px 16px;color:var(--muted)}
.chat-empty b{display:block;font-size:14.5px;color:var(--warm);margin-bottom:6px}
.chat-empty span{font-size:12px;line-height:1.8}
.chat-day{text-align:center;margin:6px 0 2px}
.chat-day span{
  font-size:10.5px;color:var(--muted);background:var(--sunken);
  border-radius:999px;padding:3px 11px
}
.msg{max-width:82%;border-radius:14px;padding:10px 12px;position:relative}
.msg p{margin:0;font-size:13.5px;line-height:1.8;word-wrap:break-word}
.msg .mt{display:block;font-size:9.5px;margin-top:5px;opacity:.75}
.msg.them{align-self:flex-start;background:var(--sunken);border:1px solid var(--line);border-start-start-radius:5px}
.msg.me{align-self:flex-end;background:var(--orange);color:var(--onAccent);border-start-end-radius:5px}
.msg.me .mt{color:var(--onAccent)}
.msg .quote{
  border-inline-start:3px solid currentColor;padding:6px 9px;margin-bottom:8px;border-radius:7px;
  background:var(--sunken);font-size:11.5px;line-height:1.65;opacity:.92
}
.msg .quote b{display:block;font-size:10.5px;margin-bottom:2px}
.reply-to{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);
  background:var(--orange-dim)
}
.reply-to div{flex:1;min-width:0}
.reply-to b{display:block;font-size:11px;color:var(--orange)}
.reply-to span{
  display:block;font-size:11px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.reply-to button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:0 4px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid var(--line)}
.composer .inp{flex:1;margin:0;min-height:44px;max-height:140px;resize:none;line-height:1.7;font-size:13.5px}
.sendbtn{
  width:44px;height:44px;flex:none;border:0;border-radius:50%;background:var(--orange);
  color:var(--onAccent);cursor:pointer;display:grid;place-items:center
}
.sendbtn svg{width:19px;height:19px;fill:currentColor;transform:scaleX(-1)}
.quickrow{display:flex;gap:6px;overflow-x:auto;padding:9px 10px 0}
.quickbtn{
  flex:none;background:transparent;border:1px solid var(--line);color:var(--warm);
  border-radius:999px;padding:6px 11px;font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap
}
.noteRow{position:relative}
.replybtn{
  display:block;margin-top:9px;background:transparent;border:1px solid rgba(255,84,32,.4);
  color:var(--orange);border-radius:8px;padding:7px 12px;font-size:11.5px;
  font-family:inherit;font-weight:700;cursor:pointer
}

/* بطاقات المتابعة في لوحة المدرب */
.fcard{position:relative;overflow:hidden}
.fcard::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px}
.fcard.away::after{background:var(--c6)}
.fcard.good::after{background:var(--c3)}
.frow{display:flex;align-items:center;gap:11px}
.fmeta{flex:1;min-width:0}
.fmeta b{display:block;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fmeta>span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.fbtns{display:flex;gap:7px;margin-top:11px;align-items:center;flex-wrap:wrap}
.fwa{
  flex:1;min-width:140px;text-align:center;text-decoration:none;background:#25D366;color:#06281a;
  font-weight:800;font-size:12.5px;border-radius:9px;padding:11px 8px
}
.fwa.thanks{background:var(--orange);color:var(--onAccent)}
.fghost{
  background:transparent;color:var(--warm);border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;font-size:12.5px;font-family:inherit;cursor:pointer
}

/* بطاقة العودة بعد الانقطاع */
.comeback{border-color:rgba(255,84,32,.42);background:var(--orange-dim);position:relative;overflow:hidden}
.comeback::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--orange)}
.cb-tag{
  display:inline-block;background:var(--orange);color:var(--onAccent);font-size:10.5px;font-weight:800;
  letter-spacing:.04em;padding:4px 10px;border-radius:999px
}
.comeback b{display:block;font-size:18px;margin-top:9px}
.comeback p{font-size:13px;color:var(--warm);margin:5px 0 0;line-height:1.75}
.cb-facts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cb-facts span{
  flex:1;min-width:88px;background:var(--surf);border:1px solid var(--line);border-radius:10px;
  padding:8px 6px;text-align:center;font-size:10px;color:var(--muted);line-height:1.5
}
.cb-facts span b{display:block;font-family:var(--data);font-size:15px;color:var(--orange);margin:0 0 2px}
.cb-row{display:flex;gap:8px;margin-top:12px}
.cb-go,.cb-wa{
  flex:1;text-align:center;border-radius:10px;padding:12px 6px;font-size:13px;font-weight:700;
  font-family:inherit;cursor:pointer;text-decoration:none;border:0
}
.cb-go{background:var(--orange);color:var(--onAccent)}
.cb-wa{background:transparent;color:#25D366;border:1px solid rgba(37,211,102,.45);line-height:1.5}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:stretch}
.plan{
  position:relative;border:1px solid var(--line);border-radius:13px;background:var(--surf);
  text-align:center;display:flex;flex-direction:column;padding:13px 8px 9px;overflow:hidden
}
.plan::before{content:'';position:absolute;inset-inline:0;top:0;height:3px;background:var(--line)}
.plan.best{border-color:rgba(255,84,32,.45);background:var(--orange-dim)}
.plan.best::before{background:var(--orange)}
.plan .tag{
  position:absolute;top:0;inset-inline-end:0;background:var(--orange);color:var(--onAccent);
  font-size:9.5px;font-weight:800;padding:3px 7px;border-end-start-radius:8px;letter-spacing:.02em
}
.plan .dur{display:block;font-size:12.5px;font-weight:700;color:var(--warm);margin-bottom:7px}
.plan .now{display:block;font-family:var(--data);font-size:23px;font-weight:700;color:var(--orange);line-height:1}
.plan .cur{display:block;font-size:9.5px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
.plan .was{
  display:block;font-family:var(--data);font-size:11.5px;color:var(--muted);
  text-decoration:line-through;margin-top:5px;min-height:15px
}
.plan .per{display:block;font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5;min-height:28px}
.plan a{
  display:block;margin-top:auto;background:var(--orange);color:var(--onAccent);font-weight:700;
  border-radius:8px;padding:9px 4px;text-decoration:none;font-size:12.5px
}
.plan:not(.best) a{background:transparent;color:var(--orange);border:1px solid rgba(255,84,32,.4)}
.jumpnow{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;
  background:var(--orange);color:var(--onAccent);border:0;border-radius:12px;
  padding:15px 16px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;
  box-shadow:0 6px 20px rgba(255,84,32,.28)
}
.jumpnow svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jumphint{font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.stickycta{
  position:fixed;inset-inline:0;bottom:0;z-index:60;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);transform:translateY(120%);transition:transform .28s ease
}
.stickycta.on{transform:none}
.stickycta button{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--orange);color:var(--onAccent);border:0;border-radius:11px;
  padding:14px;font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer
}
.pay{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pay span{
  border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12px;color:var(--warm);
  font-family:var(--data);letter-spacing:.06em
}
.credz{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-top:12px}
.credz div{background:var(--sunken);border:1px solid var(--line);border-radius:11px;padding:11px}
.credz b{display:block;font-family:var(--data);font-size:20px;color:var(--orange);line-height:1}
.credz span{font-size:11.5px;color:var(--muted)}
/* ---------- pain alert ---------- */
.sos{
  width:100%;margin-top:11px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#C9402A,#E4573C);color:#fff;font-weight:700;font-size:13.5px;
  border-radius:11px;padding:11px;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 4px 14px rgba(201,64,42,.28)
}
.sos:active{transform:scale(.985)}
.sos svg{width:17px;height:17px;fill:#fff}
.sos.sent{background:none;border:1px dashed #C9402A;color:#E4573C;box-shadow:none;font-weight:600}
.alertcard{border-color:#C9402A;border-inline-start:4px solid #C9402A}
.alertcard .who2{font-family:var(--data);font-size:12px;letter-spacing:.14em;color:#E4573C;text-transform:uppercase}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#E4573C;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.35)}}
.tabbadge{
  display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:#C9402A;color:#fff;font-family:var(--data);font-size:11px;margin-inline-start:5px
}
/* ---------- roster progress ring ---------- */
.rring{position:relative;width:56px;height:56px;flex:none}
.rring svg{width:56px;height:56px;transform:rotate(-90deg)}
.rring span{
  position:absolute;inset:0;display:grid;place-items:center;font-family:var(--data);
  font-size:16px;font-weight:600;color:var(--strong)
}
/* ---------- profile / avatars ---------- */
.avatar{
  width:52px;height:52px;border-radius:14px;object-fit:cover;flex:none;
  border:1px solid var(--line);background:var(--surf2)
}
.avatar.sm{width:38px;height:38px;border-radius:11px}
.avatar.lg{width:96px;height:96px;border-radius:22px}
.avatar.ph{display:grid;place-items:center;font-family:var(--data);font-size:20px;color:var(--orange);font-weight:600}
.upl{
  display:block;border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;
  font-size:13px;color:var(--warm);cursor:pointer;background:var(--surf2)
}
.upl:hover{border-color:var(--orange);color:var(--orange)}
.upl input{display:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:12px}
.fact{background:var(--sunken);border:1px solid var(--line);border-radius:11px;padding:10px}
.fact b{display:block;font-family:var(--data);font-size:22px;color:var(--strong);line-height:1}
.fact span{font-size:10.5px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.shot{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--surf2)}
.shot img{width:100%;height:110px;object-fit:cover;display:block}
.shot span{
  position:absolute;inset-inline:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));
  color:#fff;font-size:10.5px;padding:14px 6px 5px;text-align:center;font-family:var(--data)
}
.shot button{position:absolute;top:5px;inset-inline-end:5px;background:rgba(0,0,0,.6);color:#fff;
  border-radius:8px;width:24px;height:24px;font-size:15px;line-height:1}

/* ---------- color system ---------- */
.tint{position:relative;overflow:hidden}
.tint::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14}
.t1::after{background:radial-gradient(120% 90% at 100% 0,var(--c1),transparent 62%)}
.t2::after{background:radial-gradient(120% 90% at 100% 0,var(--c2),transparent 62%)}
.t3::after{background:radial-gradient(120% 90% at 100% 0,var(--c3),transparent 62%)}
.t4::after{background:radial-gradient(120% 90% at 100% 0,var(--c4),transparent 62%)}
.t5::after{background:radial-gradient(120% 90% at 100% 0,var(--c5),transparent 62%)}
.t6::after{background:radial-gradient(120% 90% at 100% 0,var(--c6),transparent 62%)}
.tint>*{position:relative;z-index:1}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{width:118px;height:118px;flex:none;transform:rotate(-90deg)}
.donut .lbl{flex:1;min-width:0}
.donut .big{word-break:break-word}
.donut .big{font-family:var(--data);font-size:30px;font-weight:600;color:var(--strong);line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.legend i{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-style:normal}
.legend i::before{content:"";width:10px;height:10px;border-radius:4px;background:currentColor}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wkcard{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surf)}
.wkcard b{font-family:var(--data);font-size:26px;font-weight:600;line-height:1;display:block}
.wkcard span{font-size:11.5px;color:var(--muted);display:block;margin-top:3px}
.wkcard .bar{margin-top:9px}
/* ---------- coach dashboard colors ---------- */
.kpi .card{border-inline-start-width:4px}
.kpi .c1{border-inline-start-color:var(--orange)}
.kpi .c2{border-inline-start-color:#3E8FB0}
.kpi .c3{border-inline-start-color:#5E9C76}
.kpi .c4{border-inline-start-color:#9A6FB0}
.kpi .c5{border-inline-start-color:#C9402A}
.kpi .c1 b{color:var(--orange)} .kpi .c2 b{color:#3E8FB0}
.kpi .c3 b{color:#5E9C76} .kpi .c4 b{color:#9A6FB0} .kpi .c5 b{color:#C9402A}
.sect{
  display:flex;align-items:center;gap:10px;margin:26px 0 12px;padding:11px 14px;
  background:var(--surf);border:1px solid var(--line);border-inline-start:4px solid var(--orange);
  border-radius:11px;font-family:var(--ar);font-size:16.5px;font-weight:700;
  letter-spacing:0;text-transform:none;color:var(--strong);line-height:1.45;flex-wrap:wrap
}
.sect .n{
  margin-inline-start:auto;font-family:var(--data);font-size:12px;color:var(--muted);
  background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap
}
.athrow{display:flex;align-items:center;gap:12px}
.athrow .meta{flex:1;min-width:0}
.athrow .meta b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;line-height:1.6}
.athrow .meta span{font-size:11.5px;color:var(--muted)}
.bar.b2 i{background:#3E8FB0} .bar.b3 i{background:#5E9C76} .bar.b4 i{background:#9A6FB0}
/* ---------- video button ---------- */
.vidbtn{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;width:64px
}
.vidbtn .ico{
  width:44px;height:44px;border-radius:12px;background:var(--orange);border:1px solid var(--orange);
  display:grid;place-items:center;transition:.15s
}
.vidbtn .ico svg{width:16px;height:16px;fill:var(--onAccent)}
.vidbtn .cap{font-size:11px;font-weight:600;color:var(--orange);white-space:nowrap;letter-spacing:.01em}
.vidbtn:hover .ico{filter:brightness(1.08)}
.vidbtn:active .ico{transform:scale(.95)}

/* ---------- full-screen rest ---------- */
.restfull{
  position:fixed;inset:0;z-index:88;background:var(--deep);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px
}
.restfull .ringwrap{position:relative;width:min(78vw,300px);aspect-ratio:1}
.restfull svg{width:100%;height:100%;transform:rotate(-90deg)}
.restfull .track{fill:none;stroke:var(--track);stroke-width:14}
.restfull .fill{fill:none;stroke:var(--orange);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.restfull.hot .fill{stroke:#C9402A}
.restfull .mid{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.restfull .num{font-family:var(--data);font-size:64px;font-weight:600;color:var(--strong);line-height:1}
.restfull.hot .num{color:#E4573C;animation:tick 1s ease-in-out infinite}
.restfull .of{font-size:12px;letter-spacing:.22em;color:var(--muted);font-family:var(--data)}
.restfull h3{margin-top:16px;font-size:19px}
.restfull .sub{font-size:13px;color:var(--warm);max-width:320px}
.restfull .row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.restfull .row button{border:1px solid var(--line);border-radius:11px;padding:12px 20px;font-weight:600;color:var(--warm)}
.restfull .row button.p{background:var(--orange);color:var(--onAccent);border-color:var(--orange)}
.cheer .row{display:flex;gap:10px;margin-top:8px}
.cheer .row button{background:var(--orange);color:var(--onAccent);font-weight:700;border-radius:11px;padding:13px 22px;font-size:15px}
.cheer .row button.ghost{background:transparent;color:var(--warm);border:1px solid var(--line);font-weight:600}
/* ---------- countdown + celebration ---------- */
.resting.hot{border-top-color:#C9402A}
.resting.hot .t{color:#E4573C;animation:tick 1s ease-in-out infinite}
.resting.hot .rprog{background:#C9402A}
@keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.cheer{
  position:fixed;inset:0;z-index:96;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:26px;background:rgba(12,12,14,.9);backdrop-filter:blur(6px);animation:pop .28s ease
}
html[data-theme="light"] .cheer{background:rgba(239,231,223,.94)}
.cheer img{width:78px;animation:pop .5s cubic-bezier(.2,.9,.3,1)}
.cheer h2{font-size:30px;color:var(--strong)}
.cheer p{margin:0;font-size:14px;color:var(--warm);max-width:320px}
.cheer .tag{font-family:var(--data);font-size:12px;letter-spacing:.24em;color:var(--orange);text-transform:uppercase}
.cheer .ring{
  width:78px;height:78px;border-radius:50%;border:3px solid var(--orange);display:grid;place-items:center;
  font-family:var(--data);font-size:26px;font-weight:600;color:var(--orange);animation:pop .4s ease
}
/* ---------- subscriptions ---------- */
.subchip{
  flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--data);font-size:12.5px;letter-spacing:.06em;
  padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap
}
.subchip b{font-size:15px;font-weight:600}
.subchip.ok{color:var(--orange);border-color:rgba(255,84,32,.4);background:var(--orange-dim)}
.subchip.soon{color:#fff;background:#C9402A;border-color:#C9402A}
.subchip.expired{color:#fff;background:var(--danger);border-color:var(--danger-line)}
.subcard{display:flex;align-items:center;gap:12px}
.subcard .meter{flex:1}
.subcard .meter .bar{margin-top:7px}
.subcard.expired,.subcard.soon{border-color:#C9402A}
.bar.red i{background:#C9402A}
.subbar{
  position:relative;height:16px;border-radius:999px;background:var(--track);overflow:hidden;
  border:1px solid var(--line);margin-top:10px
}
.subbar i{
  display:block;height:100%;background:linear-gradient(90deg,var(--orange),#FF7A4D);
  transition:width .6s ease;border-radius:999px
}
.subbar.red i{background:linear-gradient(90deg,#C9402A,#E4573C)}
.subbar u{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(0,0,0,.18) 13px 14px)
}
.subends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px;font-family:var(--data)}
.subhead{display:flex;align-items:flex-end;gap:10px}
.subhead b{flex:1;font-size:15px}
.subpct{
  font-family:var(--data);font-size:34px;font-weight:600;line-height:1;color:var(--orange);min-width:62px;text-align:center
}
.subpct span{font-size:15px}
.subpct.warn{color:#E4573C}
.subwarn{
  margin-top:12px;background:#C9402A;color:#fff;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;text-align:center
}
.wa.solid{background:#fff;color:#C9402A;border-color:#fff;font-weight:700;display:block;text-align:center;margin-top:9px}
.wa{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--orange);text-decoration:none;border:1px solid rgba(255,84,32,.4);border-radius:9px;padding:8px 12px}
/* ---------- brand assets ---------- */
.logo-primary{height:30px;width:auto;display:block}
.logo-word{height:24px;width:auto;opacity:.85;margin:0 auto 10px;display:block;filter:var(--logofx)}
.badge{filter:var(--logofx)}
.wm{position:absolute;inset-inline-end:-22px;top:-20px;width:140px;opacity:.09;pointer-events:none}
.badge{width:92px;opacity:.45;display:block;margin:14px auto 0}
.logo-lockup{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo-lockup img{height:38px}
.logo-lockup span{font-family:var(--data);font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;border-inline-start:1px solid var(--line);padding-inline-start:14px}
.splash{
  position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .4s var(--ease-in-out),transform .4s var(--ease-in-out)
}
.splash img{width:210px;max-width:62vw}
.splash span{font-family:var(--data);font-style:italic;font-weight:700;font-size:12px;letter-spacing:.34em;color:var(--orange)}
.splash.out{opacity:0;pointer-events:none}
.splash{animation:splashGo .5s var(--ease-in-out) 2.5s forwards}
@keyframes splashGo{to{opacity:0;visibility:hidden;pointer-events:none}}
.errbar{
  position:fixed;bottom:0;inset-inline:0;z-index:300;background:var(--danger);color:var(--onDark);
  font-size:12.5px;padding:10px 14px;text-align:center;direction:rtl
}
.mark-sm{width:26px;height:auto;flex:none}
.themebtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surf2);
  display:grid;place-items:center;margin-inline-start:12px;flex:none;transition:.15s
}
.themebtn:hover{border-color:var(--orange)}
.themebtn svg{width:18px;height:18px;stroke:var(--orange);fill:none;stroke-width:2;stroke-linecap:round}
.emom-mark{position:absolute;top:20px;inset-inline-start:20px;width:34px;opacity:.75}

footer{max-width:560px;margin:0 auto;padding:30px 16px 40px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
footer b{color:var(--warm);font-weight:600}
.toast{
  position:fixed;bottom:96px;inset-inline:0;margin:0 auto;width:max-content;max-width:88%;
  background:var(--toastbg);color:var(--toastfg);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;z-index:95;
  animation:up .2s ease
}

/* ---------- Phase 1: bottom navigation (mobile) ---------- */
.bnav{
  position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;gap:2px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--ink) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line)
}
.bnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:7px 4px;min-height:52px;border-radius:12px;color:var(--muted);
  font-size:11px;font-weight:600;position:relative;transition:.15s
}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on{color:var(--orange)}
.bnav button.on::before{content:"";position:absolute;top:0;width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--orange)}
.bnav button:active{transform:scale(.95)}
.bnav .tabbadge{position:absolute;top:3px;inset-inline-end:calc(50% - 24px);margin:0}
.wrap.hasnav{padding-bottom:150px}
@media (max-width:899px){ .tabs.onlydesk{display:none} }
@media (min-width:900px){ .bnav{display:none} .wrap.hasnav{padding-bottom:120px} }

/* ---------- Phase 1: today's session card ---------- */
.today{
  border:1px solid rgba(255,84,32,.34);
  background:linear-gradient(160deg,var(--orange-dim),transparent 62%),linear-gradient(180deg,var(--card1),var(--card2))
}
.today .kick{font-family:var(--data);font-size:11.5px;letter-spacing:.16em;color:var(--orange);display:block}
.today h2{font-size:25px;margin:7px 0 3px;color:var(--strong)}
.today .sub{font-size:13px;color:var(--warm);margin:0}
.today .tmeta{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0 0}
.today .tmeta span{
  font-size:11.5px;color:var(--warm);background:var(--surf2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px
}
.today .tmeta span b{font-family:var(--data);color:var(--strong);font-size:13px;margin-inline-end:4px}
.today.rest{border-color:var(--line);background:linear-gradient(180deg,var(--card1),var(--card2))}
.today.rest .kick{color:var(--c2)}
.today.done .kick{color:var(--c3)}

/* ---------- Phase 1: week day strip ---------- */
.wkstrip{display:flex;gap:8px;margin:0 0 14px}
.wkstrip .d{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 4px;
  border-radius:12px;border:1px solid var(--line);background:var(--surf2);
  font-size:11.5px;color:var(--muted);text-align:center
}
.wkstrip .d i{
  width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-style:normal;font-size:12.5px;font-weight:700
}
.wkstrip .d.done{color:var(--soft)}
.wkstrip .d.done i{background:var(--orange);border-color:var(--orange);color:var(--onAccent)}
.wkstrip .d.now{border-color:var(--orange);color:var(--orange)}
.wkstrip .d.now i{border-color:var(--orange);background:var(--orange-dim);color:var(--orange)}

/* ---------- شريط الإعلانات المتحرك ---------- */
.ticker{
  position:sticky;top:0;z-index:39;display:flex;align-items:center;
  height:38px;overflow:hidden;cursor:pointer;
  background:linear-gradient(90deg,color-mix(in srgb,var(--orange) 20%,var(--ink)),var(--ink) 60%);
  border-bottom:1px solid var(--line)
}
.ticker .tk-label{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;height:100%;padding:0 12px;
  background:var(--orange);color:var(--onAccent);font-family:var(--data);
  font-size:11.5px;letter-spacing:.12em;font-weight:700;white-space:nowrap;z-index:2
}
.ticker .tk-label::after{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--onAccent);animation:tkpulse 1.6s infinite
}
@keyframes tkpulse{0%,100%{opacity:1}50%{opacity:.25}}
/* المهم: القناع مرن بعرض صفر أدنى، والمسار مطلق بعرض محتواه — فلا يضغطه الفليكس */
.ticker .tk-mask{position:relative;flex:1 1 auto;min-width:0;height:100%;overflow:hidden}
.ticker .tk-track{
  position:absolute;top:0;left:0;height:100%;
  display:flex;align-items:center;width:max-content;white-space:nowrap;
  will-change:transform;animation:tkscroll linear infinite
}
.ticker .tk-item{display:inline-flex;align-items:center;gap:8px;padding:0 20px;font-size:13px;color:var(--soft);font-weight:600}
.ticker .tk-item b{color:var(--strong);font-weight:800}
.ticker .tk-item i{
  font-style:normal;font-family:var(--data);font-size:10.5px;letter-spacing:.1em;
  color:var(--orange);border:1px solid rgba(255,84,32,.4);border-radius:999px;padding:2px 7px;flex:none
}
.ticker .tk-item::after{content:"•";color:var(--muted);margin-inline-start:20px}
@keyframes tkscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker:active{filter:brightness(1.15)}
@media (prefers-reduced-motion:reduce){
  .ticker .tk-track{animation:none;position:static;width:auto}
  .ticker .tk-mask{overflow-x:auto}
}







/* ---------- برنامج «اشتراكك علينا» ---------- */
.refwrap{margin:0 -16px 14px}
.refhero{
  position:relative;overflow:hidden;padding:30px 22px 26px;text-align:center;
  background:
    radial-gradient(120% 85% at 50% 0%, rgba(255,84,32,.20), transparent 62%),
    linear-gradient(180deg, var(--charcoal), var(--ink));
  border-block:1px solid var(--line)
}
.rfglow{
  position:absolute;top:-90px;left:50%;transform:translateX(-50%);
  width:340px;height:340px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,84,32,.28), transparent 68%);filter:blur(14px)
}
.rfx{position:absolute;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,84,32,.5),transparent);height:1.5px}
.rfx1{width:180%;top:52px;right:-40%;transform:rotate(-24deg)}
.rfx2{width:180%;bottom:44px;left:-40%;transform:rotate(-24deg);opacity:.45}
.rflogo{position:relative;height:26px;opacity:.95;margin-bottom:16px}
.rfeye{
  position:relative;display:inline-block;font-family:var(--data);font-size:11px;letter-spacing:.28em;
  color:var(--orange);border:1px solid rgba(255,84,32,.45);border-radius:999px;padding:5px 14px
}
.refttl{position:relative;margin:6px 0 0;line-height:.94}
.refttl span{
  display:block;font-family:var(--disp);font-weight:900;color:var(--strong);
  font-size:clamp(34px,10.5vw,52px);letter-spacing:-.01em
}
.refttl b{
  display:block;font-family:var(--disp);font-weight:900;
  font-size:clamp(52px,17vw,86px);line-height:.92;margin-top:2px;
  background:linear-gradient(180deg,#FF7A46,var(--orange) 55%,#C9401F);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(255,84,32,.4))
}
.rfsub{
  position:relative;font-size:13.5px;color:var(--warm);line-height:2;
  margin:14px auto 0;max-width:330px
}
.rfeq{
  position:relative;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  margin:20px 0 0;padding:13px 12px;border-radius:14px;
  border:1px solid rgba(255,84,32,.3);background:rgba(255,84,32,.09)
}
.eqp{display:flex;gap:-4px}
.eqp i{font-style:normal;font-size:17px;margin-inline-start:-5px;filter:grayscale(.15)}
.eqx{font-family:var(--data);font-size:16px;color:var(--muted)}
.eqv,.eqr{font-family:var(--data);font-weight:700;line-height:1}
.eqv{font-size:24px;color:var(--strong)}
.eqr{font-size:30px;color:var(--orange)}
.eqv u,.eqr u{text-decoration:none;font-size:.55em;opacity:.75;margin-inline-start:1px}
.rffree{
  position:relative;display:inline-block;margin-top:16px;font-size:13px;font-weight:700;
  color:var(--onAccent);background:var(--orange);border-radius:999px;padding:9px 18px;
  box-shadow:0 10px 26px rgba(255,84,32,.32)
}

.rfsplit{display:flex;gap:8px;margin:0 0 16px}
.rfsplit>div{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:13px 6px;
  border-radius:14px;border:1px solid var(--line);background:var(--surf2);text-align:center
}
.rfsplit b{font-family:var(--data);font-size:23px;color:var(--strong);line-height:1}
.rfsplit span{font-size:10.5px;color:var(--muted)}
.rfsplit .hot{border-color:rgba(255,84,32,.45);background:var(--orange-dim)}
.rfsplit .hot b{color:var(--orange)}

.refsteps{position:relative;display:grid;gap:10px;margin:0 0 16px}
.refsteps::before{
  content:"";position:absolute;top:26px;bottom:26px;inset-inline-start:35px;
  width:2px;background:linear-gradient(180deg,var(--orange),rgba(255,84,32,.15));border-radius:2px
}
.refsteps>div{
  position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;
  padding:14px 15px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--card1),var(--card2))
}
.refsteps .rn{
  grid-row:span 2;position:relative;z-index:1;
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--orange);color:var(--onAccent);font-family:var(--data);font-size:18px;font-weight:700;
  box-shadow:0 6px 16px rgba(255,84,32,.34)
}
.refsteps b{font-size:15px;color:var(--strong)}
.refsteps span:not(.rn){font-size:12px;color:var(--muted);line-height:1.8}

.refcode{text-align:center;border-color:rgba(255,84,32,.45);position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,84,32,.18),transparent 60%),linear-gradient(180deg,var(--card1),var(--card2))}
.rclabel{font-size:11.5px;color:var(--warm);letter-spacing:.06em}
.rcode{
  display:block;font-family:var(--data);font-size:clamp(38px,13vw,54px);letter-spacing:.12em;
  color:var(--orange);margin:8px 0 16px;font-weight:700;
  text-shadow:0 6px 24px rgba(255,84,32,.35)
}
.refbtns{display:flex;gap:8px}
.refbtns>*{flex:1;text-align:center}
.refprog{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
.refbar{height:12px;border-radius:9px;background:var(--track);overflow:hidden}
.refbar i{display:block;height:100%;border-radius:9px;
  background:linear-gradient(90deg,#FF7A46,var(--orange));transition:width .5s}
.refnums{display:flex;gap:8px;margin-top:12px}
.refnums span{flex:1;display:flex;flex-direction:column;font-size:10.5px;color:var(--muted)}
.refnums b{font-family:var(--data);font-size:21px;color:var(--strong)}
.refnote{font-size:11.5px;color:var(--warm);margin:12px 0 0;line-height:1.8}
.refwin{font-size:13.5px;color:var(--c3);font-weight:700;margin:12px 0 0}

.refwin3>div{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.refwin3>div:first-child{border-top:0;padding-top:0}
.refwin3 .ic{
  grid-row:span 2;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--orange-dim);color:var(--orange);font-size:17px;font-weight:700
}
.refwin3 b{font-size:14px;color:var(--strong)}
.refwin3 span:not(.ic){font-size:12px;color:var(--muted);line-height:1.8}

.refterms b{font-size:13px;color:var(--strong)}
.refterms ul{margin:8px 0 0;padding-inline-start:18px}
.refterms li{font-size:12px;color:var(--muted);line-height:2}


/* الوضع الفاتح للبرنامج */
html[data-theme="light"] .refhero{
  background:
    radial-gradient(120% 85% at 50% 0%, rgba(232,64,29,.14), transparent 62%),
    linear-gradient(180deg, #FAF4EE, #EFE7DF)
}
html[data-theme="light"] .refttl b{
  background:linear-gradient(180deg,#FF6A34,#E8401D 55%,#B8331A);

  filter:drop-shadow(0 5px 18px rgba(232,64,29,.28))
}
html[data-theme="light"] .rfglow{background:radial-gradient(circle, rgba(232,64,29,.18), transparent 68%)}
html[data-theme="light"] .rffree{box-shadow:0 8px 20px rgba(232,64,29,.24)}


/* ---------- هيرو صفحة الاشتراك (بنفس أسلوب صفحة البرنامج) ---------- */
.jh2{padding-bottom:30px}
.jheye{
  position:relative;display:inline-block;font-family:var(--data);font-size:10.5px;letter-spacing:.24em;
  color:var(--orange);border:1px solid rgba(255,84,32,.45);border-radius:999px;padding:5px 13px
}

/* شارة الهيرو المقسّمة */
.jhbadge{
  position:relative;display:inline-flex;align-items:stretch;gap:0;
  border:1px solid rgba(255,84,32,.42);border-radius:999px;overflow:hidden;
  background:rgba(255,84,32,.07)
}
.jhbadge .dot{
  align-self:center;width:6px;height:6px;border-radius:50%;background:var(--orange);
  margin-inline-start:11px;animation:tkpulse 1.8s infinite;flex:none
}
.jhbadge b{
  font-family:var(--data);font-size:10.5px;letter-spacing:.24em;font-weight:700;
  color:var(--orange);padding:7px 10px 7px 9px;display:flex;align-items:center
}
.jhbadge em{
  font-style:normal;font-size:10.5px;color:var(--warm);padding:7px 12px;display:flex;align-items:center;
  border-inline-start:1px solid rgba(255,84,32,.3);background:rgba(255,84,32,.06)
}
.jhstats b.word{font-family:var(--disp);font-size:19px;font-weight:900}
@media (max-width:340px){ .jhbadge em{display:none} }

.jhttl{margin:14px 0 0}
.jhttl span{font-size:clamp(26px,8vw,38px)}
.jhttl b{font-size:clamp(36px,11.5vw,58px);line-height:1.02}
.jhstats{
  position:relative;display:flex;gap:8px;margin:20px 0 0
}
.jhstats span{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 4px;
  border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  font-size:10.5px;color:var(--muted);text-align:center
}
.jhstats b{font-family:var(--data);font-size:21px;color:var(--orange);line-height:1}
.rfcta{

}
.jhtags{position:relative;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.jhtags span{
  font-family:var(--data);font-size:10.5px;letter-spacing:.14em;color:var(--warm);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px
}
.jh2 .paylogos{position:relative;justify-content:center;margin-top:14px}
html[data-theme="light"] .jhstats span{background:rgba(0,0,0,.03)}
html[data-theme="light"] .jhstats b{color:#E8401D}


/* مؤشر متابعة الكود والصورة التسويقية */
.trackbox{
  display:grid;grid-template-columns:auto 1fr;gap:4px 11px;align-items:center;
  margin-top:14px;padding:13px;border-radius:14px;
  border:1px dashed rgba(255,84,32,.4);background:var(--orange-dim);text-align:start
}
.tkico{grid-row:span 2;font-size:20px}
.tktx{display:flex;flex-direction:column;gap:3px}
.tktx b{font-size:13px;color:var(--strong)}
.tktx span{font-size:11.5px;color:var(--warm);line-height:1.8}

  display:block;width:100%;border-radius:14px;border:1px solid var(--line);

}
.dmrow{display:flex;gap:7px;margin-top:12px}
.dmrow span{
  flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;
  padding:10px 5px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);
  font-size:10px;color:var(--muted);line-height:1.5
}
.dmrow b{font-family:var(--data);font-size:18px;color:var(--orange);line-height:1}
.demoref p{font-size:11.5px;color:var(--warm);margin:11px 0 2px;line-height:1.85;text-align:center}


.refbanner{
  cursor:pointer;border-color:rgba(255,84,32,.34);
  background:linear-gradient(120deg,var(--orange-dim),transparent 72%),linear-gradient(180deg,var(--card1),var(--card2))
}
.refbanner:active{transform:scale(.99)}
.rbtag{
  display:inline-block;font-family:var(--data);font-size:10px;letter-spacing:.14em;
  background:var(--orange);color:var(--onAccent);border-radius:999px;padding:3px 9px
}
.refbanner b{display:block;font-family:var(--disp);font-size:20px;color:var(--strong);margin:9px 0 5px}
.refbanner p{font-size:12.5px;color:var(--warm);margin:0;line-height:1.85}
.rbgo{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--orange);font-weight:700}
.refbanner.slim b{font-size:17px}

.refin{text-transform:uppercase;letter-spacing:.08em;font-family:var(--data)}
.refok{font-size:12px;color:var(--c3);margin:7px 0 0}
.rcode-sm{
  flex:none;font-family:var(--data);font-size:13px;font-weight:700;color:var(--orange);
  background:var(--orange-dim);border:1px solid rgba(255,84,32,.35);border-radius:8px;padding:5px 9px
}
.rcode-sm.sm{font-size:11px;padding:2px 6px;margin-inline-start:6px}



/* زر الإنشاء الفوري وبطاقة بيانات الدخول */
.logbtn.mk{
  background:var(--orange);border-color:var(--orange);color:var(--onAccent);font-weight:700
}
.credbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.credbox>div{
  display:flex;flex-direction:column;gap:3px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--surf2)
}
.credbox span{font-size:10.5px;color:var(--muted)}

/* ---------- بطاقات الصحة ---------- */
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

}

/* ---------- زر الإعلانات ---------- */
.annbtn{position:relative}

.annbtn .dot{
  position:absolute;top:-3px;inset-inline-end:-3px;width:10px;height:10px;border-radius:50%;

}

/* =========================================================================
   PREMIUM MOTION + STATE SYSTEM
   Additive layer: refines existing components with hover/press/focus/
   disabled/loading states and a shared, restrained motion vocabulary.
   ========================================================================= */

/* ---------- view navigation ---------- */
@keyframes navIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app{animation:none}
#app.nav-enter{animation:navIn var(--dur-reveal) var(--ease-out)}
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--dur-ui)}
@media (prefers-reduced-motion:reduce){
  #app.nav-enter{animation:none}
}

/* ---------- reveal-on-scroll utility (opt-in via data-reveal) ---------- */
[data-reveal]{opacity:0;transform:translateY(10px)}
[data-reveal].in{opacity:1;transform:none;transition:opacity var(--dur-reveal) var(--ease-out),transform var(--dur-reveal) var(--ease-out)}
@media (prefers-reduced-motion:reduce){ [data-reveal]{opacity:1;transform:none} }

/* ---------- button system: hover / press / focus / disabled / loading ---------- */
.btn{position:relative;transition:transform var(--dur-micro) var(--ease-out),filter var(--dur-micro) var(--ease-out),opacity var(--dur-micro) var(--ease-out),box-shadow var(--dur-ui) var(--ease-out)}
@media (hover:hover){
  .btn:not(.ghost):hover{filter:brightness(1.06)}
  .btn.ghost:hover{border-color:var(--orange);color:var(--orange)}
}
.btn:active{transform:scale(.98)}
.btn[disabled],.btn.is-disabled{opacity:.45;pointer-events:none;filter:none}
.btn.is-loading{color:transparent!important;pointer-events:none}
.btn.is-loading::after{
  content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:currentColor;color:var(--onAccent);
  animation:spin .7s linear infinite
}
.btn.ghost.is-loading::after{color:var(--warm);border-color:var(--line);border-top-color:var(--warm)}
@keyframes spin{to{transform:rotate(360deg)}}

/* icon/utility buttons: consistent press + focus feel */
.vidbtn,.themebtn,.wizx,.dstep,.fghost,.replybtn,.step .ic{transition:transform var(--dur-micro) var(--ease-out),border-color var(--dur-ui) var(--ease-out),background-color var(--dur-ui) var(--ease-out)}
.vidbtn:active,.themebtn:active,.wizx:active,.dstep:active,.fghost:active{transform:scale(.94)}

/* ---------- card system: elevation + hover + pressed ---------- */
.card{transition:border-color var(--dur-ui) var(--ease-out),box-shadow var(--dur-ui) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
button.card,a.card,[data-tab-card]{cursor:pointer}
@media (hover:hover){
  a.card:hover,button.card:hover{border-color:rgba(255,84,32,.4);box-shadow:var(--e2)}
}
a.card:active,button.card:active{transform:scale(.99)}
.card.today,.card.comeback,.card.refcode{box-shadow:var(--e1)}

/* ---------- form system: focus / error / success ---------- */
.inp{transition:border-color var(--dur-ui) var(--ease-out),box-shadow var(--dur-ui) var(--ease-out)}
.inp:focus{box-shadow:var(--ring-accent)}
.inp.err{border-color:var(--bad)}
.inp.ok{border-color:var(--ok)}
.f-msg{display:block;font-size:11.5px;margin-top:6px;line-height:1.6}
.f-msg.err{color:var(--bad)}
.f-msg.ok{color:var(--ok)}

/* choice controls: chips/segs/pills/options — press + selected transition already exist; add motion */
.chip,.seg,.pill,.opt,.pp,.setbtn,.tab,.week,.day{transition:background-color var(--dur-ui) var(--ease-out),border-color var(--dur-ui) var(--ease-out),color var(--dur-ui) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.chip:active,.seg:active,.pill:active,.opt:active,.pp:active,.week:active{transform:scale(.97)}
.setbtn.on{animation:setPop var(--dur-micro) var(--ease-spring)}
@keyframes setPop{0%{transform:scale(.88)}100%{transform:scale(1)}}

/* ---------- bottom nav: soft active indicator ---------- */
.bnav button::before{content:"";position:absolute;top:0;width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--orange);opacity:0;transform:translateY(-2px);transition:opacity var(--dur-ui) var(--ease-out),transform var(--dur-ui) var(--ease-out)}
.bnav button.on::before{opacity:1;transform:none}
.bnav button svg{transition:transform var(--dur-ui) var(--ease-spring)}
.bnav button.on svg{transform:translateY(-1px)}

/* ---------- sheets / modals: open + close ---------- */
.sheet{animation:scrimIn var(--dur-ui) var(--ease-out)}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.sheet .panel{animation:sheetIn var(--dur-reveal) var(--ease-out)}
@keyframes sheetIn{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet.closing{animation:scrimOut var(--dur-ui) var(--ease-in-out) forwards}
.sheet.closing .panel{animation:sheetOut var(--dur-ui) var(--ease-in-out) forwards}
@keyframes scrimOut{to{opacity:0}}
@keyframes sheetOut{to{transform:translateY(18px);opacity:0}}
.promo-wrap.closing{opacity:0}

/* ---------- splash: controlled premium open ---------- */
.splash img{animation:splashMark .5s var(--ease-spring) both}
.splash span{animation:splashWord .5s var(--ease-out) .15s both}
@keyframes splashMark{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes splashWord{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.splash.out{transform:scale(1.02)}
@media (prefers-reduced-motion:reduce){
  .splash img,.splash span{animation:none}
  .splash.out{transform:none}
}

/* ---------- completion / celebration: short + controlled ---------- */
.cheer .ring{animation:cheerRing var(--dur-cheer) var(--ease-spring)}
@keyframes cheerRing{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.chevbar i.f{animation:chevFill var(--dur-ui) var(--ease-out)}
@keyframes chevFill{from{opacity:.55;transform:scaleY(.7)}to{opacity:1;transform:none}}

/* ---------- skeleton loading (lightweight, opt-in via .skel) ---------- */
.skel{position:relative;overflow:hidden;background:var(--surf2);border-radius:8px;color:transparent!important}
.skel::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  animation:skelSweep 1.3s ease-in-out infinite
}
@keyframes skelSweep{100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){ .skel::after{animation:none} }

/* ---------- coach console: desktop density ---------- */
@media (min-width:900px){
  .wrap.wide{padding-inline:24px}
  .kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  table.t{font-size:13px}
  table.t th{position:sticky;top:0;background:var(--surf);z-index:1}
  .scroll table.t tr:hover td{background:var(--sunken)}
}

/* ---------- minimum comfortable touch targets ---------- */
.tab,.setbtn{min-height:44px}
.setbtn{min-width:44px}
.dstep,.themebtn,.wizx{min-height:44px;min-width:44px}
</style>

/* ================= المحادثة الفورية بين الكابتن والمتدرب =================
   تُحفظ في صف مستقل لكل متدرب (<id>:chat) حتى لا تتعارض مع بيانات التمرين،
   وكل إرسال يقرأ آخر نسخة ثم يدمج ثم يكتب — فلا تضيع رسالة أحد الطرفين.      */
let CHAT=[], CHAT_FOR=null, CHATS={}, CHAT_REF=null, CHAT_SENDING=false;
const chatRow   = id => id+':chat';
const chatLocal = id => 'reshape:chat:'+id;
const newMsgId  = f => f.charAt(0)+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function chatMerge(a,b){
  const map={};
  (a||[]).concat(b||[]).forEach(m=>{
    if(!m||!m.id) return;
    const p=map[m.id];
    map[m.id] = p ? Object.assign({},p,m,{read:!!(p.read||m.read)}) : m;
  });
  return Object.keys(map).map(k=>map[k]).sort((x,y)=>x.ts-y.ts).slice(-300);
}
const chatUnread = (list,side)=> (list||[]).filter(m=>m.from!==side&&!m.read).length;

async function chatPull(id){
  if(!id) return [];
  let list=lget(chatLocal(id))||[];
  if(cloudOn()){
    try{
      const r=await cloudRow(chatRow(id));
      list=chatMerge(list,(r&&r.data&&r.data.msgs)||[]);
      NET.state='ok'; NET.last=Date.now();
    }catch(err){ NET.state='err'; }
  }
  lset(chatLocal(id),list);
  CHATS[id]=list;
  if(CHAT_FOR===id) CHAT=list;
  return list;
}
async function chatPush(id,list){
  lset(chatLocal(id),list);
  CHATS[id]=list;
  if(!cloudOn()){ NET.state='local'; paintNet(); return false; }
  try{
    const r=await cloudRow(chatRow(id));
    const merged=chatMerge((r&&r.data&&r.data.msgs)||[],list);
    await cloudSet(chatRow(id),{msgs:merged},Date.now());
    lset(chatLocal(id),merged); CHATS[id]=merged;
    if(CHAT_FOR===id) CHAT=merged;
    NET.state='ok'; NET.last=Date.now(); paintNet();
    return true;
  }catch(err){ NET.state='err'; paintNet(); return false; }
}

function refMake(name){
  const clean=String(name||'').replace(/[^A-Za-z\u0621-\u064A ]/g,'').trim();
  const first=clean.split(/\s+/)[0]||'REF';
  const lat={'ا':'A','أ':'A','إ':'A','آ':'A','ب':'B','ت':'T','ث':'TH','ج':'J','ح':'H','خ':'KH','د':'D','ذ':'TH',
    'ر':'R','ز':'Z','س':'S','ش':'SH','ص':'S','ض':'D','ط':'T','ظ':'Z','ع':'A','غ':'GH','ف':'F','ق':'Q','ك':'K',
    'ل':'L','م':'M','ن':'N','ه':'H','و':'W','ي':'Y','ى':'A','ة':'H','ء':'A'};
  let base='';
  for(const ch of first){ base += (lat[ch]||ch); if(base.length>=3) break; }
  base=(base||'REF').toUpperCase().slice(0,3);
  let code, n=0;
  do{ code=base+'-'+String(Math.floor(10+Math.random()*89)); n++; }
  while(REFS.some(r=>r.code===code) && n<40);
  return code;
}

const DAYNAMES_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
/* رقم اليوم من نص عنوان الحصة — يقبل العربية والإنجليزية معاً */
function dayNumOf(dstr){
  const t=String(dstr||''), low=t.toLowerCase();
  for(let i=0;i<7;i++){
    if(t.indexOf(DAYNAMES_AR[i])>=0) return i;
    if(low.indexOf(DAYNAMES_EN[i].toLowerCase())>=0) return i;
  }
  return -1;
}
const isTodayName = dstr => dayNumOf(dstr)===new Date().getDay();
function todaySession(){
  if(!PROGRAM||!PROGRAM.length) return null;
  const W=PROGRAM[Math.min(UI.week,PROGRAM.length)-1]||PROGRAM[0];
  const d=W.days.findIndex(D=>isTodayName(D.d));
  return d<0?null:{w:W.w,d,D:W.days[d]};
}

             : h<17?T('مساء الخير','Good afternoon') : T('مساء الخير','Good evening');
  const t=todaySession();
  const st=t?dayStats(t.w,t.d):null;
  const line = !t ? T('اليوم راحة — استفد منها للنوم والاستشفاء.','Rest day — use it for sleep and recovery.')
    : (st&&st.pct===100) ? T('أنهيت حصة اليوم بالكامل — عمل ممتاز.','You finished today\'s session in full — great work.')
